<aside class="sidebar"><div class="logo"><span class="logo-mark">D<span style="font-size:11px;vertical-align:top">.</span></span><span>Daily Discipline</span></div><div><div class="side-hint">WORKSPACE</div><nav class="side-nav" id="side-nav"></nav></div><div class="side-footer"><b>BUILD YOUR DAY.</b>一つずつ、確実に。<div style="margin-top:13px;color:#56686f">記録はこの端末にも保存されます。</div></div></aside>
<div class="shell"><header class="topbar"><div class="top-brand"><span class="logo-mark">D.</span> Daily Discipline</div><div class="top-right"><span class="time-label-top">MAKE TODAY COUNT</span><span class="today-pill"><span class="live-dot"></span><span id="current-date"></span></span><button class="settings-trigger" type="button" data-action="tab" data-id="more" aria-label="設定を開く" title="設定"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header><main class="content"><div id="review"></div><section class="view active" id="today"></section><section class="view" id="calendar"></section><section class="view" id="routine"></section><section class="view" id="diary"></section><section class="view" id="law"></section><section class="view" id="plan"></section><section class="view" id="more"></section></main></div>
<nav class="mobile-nav" id="mobile-nav" aria-label="メインナビゲーション"></nav>
</div>
<dialog id="x-dialog"><div class="modal-content" id="x-dialog-content"></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="task-dialog" aria-labelledby="task-dialog-title"><form id="task-form" class="modal-content"><div class="modal-head"><h2 class="modal-title" id="task-dialog-title">やることを追加</h2><button class="icon-btn" type="button" data-close aria-label="閉じる">✕</button></div><input type="hidden" id="task-id"><div class="field"><label class="field-label" for="task-title">やること</label><input id="task-title" maxlength="160" required placeholder="例：民法の問題演習"></div><div class="form-grid" style="margin-top:14px"><div class="field"><label class="field-label" for="task-category">カテゴリ</label><select id="task-category" required></select></div><div class="field"><label class="field-label" for="task-new-category">カテゴリを追加</label><div class="x-category-add"><input id="task-new-category" maxlength="40" placeholder="新しいカテゴリ名"><button type="button" class="btn btn-quiet" data-x="add-category" data-input="task-new-category" data-target="task-category">追加</button></div></div><div class="field"><label class="field-label" for="task-goal">予定時間（分）</label><input id="task-goal" type="number" min="0" max="1440" value="0"></div><div class="field wide"><label class="flow-schedule-toggle"><input type="checkbox" id="task-scheduled"> 時間を決めてカレンダーに入れる</label></div><div class="field"><label class="field-label" for="task-start">開始時刻</label><input id="task-start" type="time" min="05:00" max="22:00"></div><div class="field"><label class="field-label" for="task-end">終了時刻</label><input id="task-end" type="time" min="05:00" max="22:00"></div><div class="field wide"><p id="task-link-hint" class="hint"></p></div><div class="field wide"><p class="hint" style="margin:0">今日の日付にだけ保存されます。翌日には引き継ぎません。<br>定期的な予定はCalendarで繰り返しを設定できます。</p></div></div><div class="modal-footer"><button type="button" class="btn btn-danger hide" id="task-delete">削除</button><button type="button" class="btn btn-quiet" data-close>キャンセル</button><button type="submit" class="btn btn-primary">保存</button></div></form></dialog>
<dialog id="event-dialog" aria-labelledby="event-dialog-title"><form id="event-form" class="modal-content"><div class="modal-head"><h2 class="modal-title" id="event-dialog-title">予定を追加</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button></div><input type="hidden" id="event-id"><div class="form-grid"><div class="field wide"><label class="field-label" for="event-title">予定名</label><input id="event-title" required maxlength="200" placeholder="例：刑法の講義"></div><div class="field"><label class="field-label" for="event-category">カテゴリ</label><select id="event-category"></select></div><div class="field"><label class="field-label" for="event-category-color">カテゴリの色</label><input id="event-category-color" type="color" value="#77877d"><span class="hint">同じカテゴリの予定すべてに反映します。</span></div><div class="field wide"><label class="field-label" for="event-new-category">カテゴリを追加</label><div class="x-category-add"><input id="event-new-category" maxlength="40" placeholder="新しいカテゴリ名"><button type="button" class="btn btn-quiet" data-x="add-category" data-input="event-new-category" data-target="event-category">追加</button></div></div><div class="field"><label class="field-label" for="event-date">日付</label><input id="event-date" type="date" required></div><div class="field"><label class="field-label" for="event-start">開始時刻</label><input id="event-start" type="time" required></div><div class="field"><label class="field-label" for="event-end">終了時刻</label><input id="event-end" type="time" required></div><div class="field"><label class="field-label" for="event-repeat">繰り返し</label><select id="event-repeat"><option value="none">繰り返さない</option><option value="daily">毎日</option><option value="weekly">毎週（曜日を指定）</option></select></div><div class="field hide" id="event-until-field"><label class="field-label" for="event-until">繰り返しの終了日（任意）</label><input id="event-until" type="date"></div><div class="field wide hide" id="event-days-field"><span class="field-label">繰り返す曜日</span><div id="event-days" class="days-options"></div></div><div class="field wide"><div class="hint" id="event-repeat-hint">指定した日付の予定を登録します。</div></div><div class="field wide"><label class="field-label" for="event-note">メモ</label><textarea id="event-note" placeholder="任意" style="min-height:70px"></textarea></div></div><div class="modal-footer"><button type="button" class="btn btn-danger hide" id="event-delete">削除</button><button type="button" class="btn btn-quiet" data-close>キャンセル</button><button type="submit" class="btn btn-primary">保存</button></div></form></dialog>
<dialog id="routine-dialog" aria-labelledby="routine-dialog-title"><form id="routine-form" class="modal-content"><div class="modal-head"><h2 class="modal-title" id="routine-dialog-title">ルーティンを追加</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button></div><input type="hidden" id="routine-id"><div class="form-grid"><div class="field"><label class="field-label" for="routine-group">時間帯</label><select id="routine-group"><option value="朝">朝</option><option value="昼">昼</option><option value="夜">夜</option></select></div><div class="field"><label class="field-label" for="routine-time">時刻</label><input id="routine-time" type="time"></div><div class="field wide"><label class="field-label" for="routine-title">ルーティン名</label><input id="routine-title" required maxlength="160" placeholder="例：ストレッチ"></div><div class="field"><label class="field-label" for="routine-goal">予定時間（分）</label><input id="routine-goal" type="number" min="0" max="1440" value="0"></div></div><div class="modal-footer"><button type="button" class="btn btn-danger hide" id="routine-delete">削除</button><button type="button" class="btn btn-quiet" data-close>キャンセル</button><button type="submit" class="btn btn-primary">保存</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';
const KEY='dailyDiscipline_v6', BACKUP='dailyDiscipline_backup_before_v5_2';
const $=id=>document.getElementById(id);
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
const now=()=>iso(new Date());
const date=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const validDay=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(date(s).getTime());
const shift=(s,n)=>{const d=date(s);d.setDate(d.getDate()+n);return iso(d)};
const days=['日','月','火','水','木','金','土'],allDays=[0,1,2,3,4,5,6],groups=['朝','昼','夜'];
// Shared display formatters. Input values and persisted dates keep their original schema.
function formatDate(value){if(!validateDay(value))return '—';const dt=date(value);return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日（${['日','月','火','水','木','金','土'][dt.getDay()]}）`}
function formatShortDate(value){if(!validateDay(value))return '—';const dt=date(value);return `${dt.getMonth()+1}月${dt.getDate()}日`}
function formatMonth(value){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(value||''))return '—';const [y,m]=value.split('-');return `${Number(y)}年${Number(m)}月`}
function formatPeriod(start,end){if(!validateDay(start)||!validateDay(end))return '—';const a=date(start),b=date(end);return `${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日〜${a.getFullYear()!==b.getFullYear()?b.getFullYear()+'年':''}${b.getMonth()+1}月${b.getDate()}日`}
function formatDateTime(value){if(typeof value!=='string')return '—';const [d,t]=value.split('T');if(!validateDay(d)||!/^([01]\d|2[0-3]):[0-5]\d/.test(t||''))return '—';return `${formatDate(d)} ${t.slice(0,5)}`}
function formatTimestamp(value){const dt=new Date(value);if(!value||!Number.isFinite(dt.getTime()))return '—';return `${formatDate(iso(dt))} ${p(dt.getHours())}:${p(dt.getMinutes())}`}
function formatDuration(value){const n=Math.max(0,Math.round(Number(value)||0));return n<60?`${n}分`:`${Math.floor(n/60)}時間${n%60?n%60+'分':''}`}
function formatArchiveDate(kind,d){if(kind==='monthly')return formatMonth(d);if(kind==='weekly')return formatPeriod(d,shift(d,6));return formatDate(d)}

const fullDate=d=>formatDate(d);
const shortDate=d=>formatShortDate(d);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const blankRecord=()=>({manualStudy:0,weight:'',bodyFat:''});
function blankV6(){const d=date(now());d.setDate(d.getDate()-((d.getDay()+6)%7));return {week:iso(d),categories:[{id:'school',name:'大学課題',field:'大学'},{id:'law',name:'司法試験',field:'法律学習'}],goals:[],actions:[],assignments:[],reviews:[],books:[],rules:[],activities:[],archiveTrash:[],ruleChecks:{},ruleHistory:{},weekly:{},monthly:{},promises:{},habitSnapshots:{},eventOutcomes:{},trashEntries:[],taskTemplates:[],taskCorrections:[],plannerPrefs:{},yesterdayConfirmed:{},direction:{mission:"",goals:[]},favoriteQuotes:[],quotePrefs:{},featureSchema:7}}
function cleanV6(raw){const out=blankV6();if(!raw||typeof raw!=='object')return out;for(const k of Object.keys(raw))if(!(k in out)&&!['__proto__','constructor','prototype'].includes(k))out[k]=raw[k];for(const k of Object.keys(out)){if(Array.isArray(out[k])){out[k]=Array.isArray(raw[k])?raw[k].filter(v=>v&&typeof v==='object'&&/^[a-zA-Z0-9_-]+$/.test(v.id||'')):[]}else if(typeof out[k]==='object'){out[k]=raw[k]&&typeof raw[k]==='object'&&!Array.isArray(raw[k])?raw[k]:{}}else if(typeof out[k]==='number')out[k]=Math.max(out[k],Number(raw[k])||0);else if(validDay(raw[k]))out[k]=raw[k]}for(const arr of ['goals','actions','assignments','reviews','books','rules','activities'])for(const v of out[arr]){for(const k of ['minutes','count','pages','position','total','target','stage'])if(v[k]!==undefined)v[k]=Math.max(0,Number(v[k])||0);if(arr==='goals')v.target=Math.max(1,v.target||1);if(arr==='reviews')v.logs=Array.isArray(v.logs)?v.logs:[];if(arr==='rules')v.days=Array.isArray(v.days)?v.days.filter(d=>allDays.includes(d)):allDays.slice();if(arr==='assignments'){v.steps=Array.isArray(v.steps)?v.steps:[];v.due=String(v.due||now()+'T23:59');for(const q of v.steps)q.minutes=Math.max(0,Number(q.minutes)||0)}if(arr==='activities'&&v.kind==='workout'){v.sets=Array.isArray(v.sets)?v.sets:[];for(const q of v.sets)q.reps=Math.max(0,Number(q.reps)||0)}}return out}
const seed=()=>({version:6,v6:blankV6(),dailyTasksMigrated:false,timerRemovedMigrated:false,archivedSessions:[],tasks:[],checks:{},snapshots:{},events:[],routines:{朝:[],昼:[],夜:[]},routineChecks:{},records:{},diaries:{},sessions:[],reviews:{},timer:{running:false,started:null,elapsed:0,duration:50,taskId:''},calendarMode:'日',calendarDate:now(),diaryDate:now(),recordDate:now(),initialized:now(),chartMode:'日'});
function normalize(a){const o=seed();if(!a||typeof a!=='object')return o;for(const k of Object.keys(o))if(a[k]!==undefined)o[k]=a[k];o.tasks=Array.isArray(o.tasks)?o.tasks:[];o.events=Array.isArray(o.events)?o.events:[];o.sessions=Array.isArray(o.sessions)?o.sessions:[];for(const k of ['checks','snapshots','routineChecks','records','diaries','reviews'])if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={};if(!o.routines||typeof o.routines!=='object')o.routines={};for(const g of groups)if(!Array.isArray(o.routines[g]))o.routines[g]=[];for(const t of o.tasks)if(!Array.isArray(t.days))t.days=allDays.slice();for(const g of groups)for(const r of o.routines[g])if(!Array.isArray(r.days))r.days=allDays.slice();if(!o.timer||typeof o.timer!=='object')o.timer=seed().timer;Object.assign(o.timer,{duration:[25,50,90].includes(Number(o.timer.duration))?Number(o.timer.duration):50});for(const k of ['calendarDate','diaryDate','recordDate'])if(!validDay(o[k]))o[k]=now();if(!['日','週','月'].includes(o.calendarMode))o.calendarMode='日';if(!['日','週','月'].includes(o.chartMode))o.chartMode='日';o.v6=cleanV6(o.v6);o.version=6;return o}
let saved=null;try{const raw=localStorage.getItem(KEY)||localStorage.getItem('dailyDiscipline_v5');if(raw){saved=JSON.parse(raw);if(!localStorage.getItem(BACKUP))localStorage.setItem(BACKUP,raw)}}catch(e){console.warn('Local data could not be read',e)}
let s=normalize(saved),activeTab='today',toastTimer=null;
// One-time migration: keep today's list, then start a fresh list every day.
if(!s.dailyTasksMigrated){
 for(const t of s.tasks)if(!validDay(t.date))t.date=(t.days||allDays).includes(date(now()).getDay())?now():shift(now(),-1);
 for(const [d,list] of Object.entries(s.snapshots)){
  if(d>now())s.snapshots[d]=list.filter(t=>t.date===d);
  else for(const t of list)if(!validDay(t.date))t.date=d;
 }
 s.dailyTasksMigrated=true;
}
// v5.4: weekly/daily calendar recurrence; simplified records and diary.
// v5.3: timer UI removed. Fold old sessions into the total once, preserve archive.
if (!s.timerRemovedMigrated) {
  const byDay={};
  for(const session of s.sessions) {
    if(!validDay(session.date))continue;
    byDay[session.date]=(byDay[session.date]||0)+Math.max(0,Number(session.minutes)||0);
  }
  for(const [day, mins] of Object.entries(byDay)) {
    if(!s.records[day])s.records[day]=blankRecord();
    s.records[day].manualStudy=Math.max(0,Number(s.records[day].manualStudy)||0)+mins;
  }
  s.archivedSessions=[...(Array.isArray(s.archivedSessions)?s.archivedSessions:[]),...s.sessions];
  s.sessions=[];
  s.timer={running:false,started:null,elapsed:0,duration:50,taskId:''};
  s.timerRemovedMigrated=true;
}

function persist(){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){window.alert('データを保存できません。ブラウザの空き容量や設定を確認してください。');console.error(e);return false}}
function ensure(d){if(!s.snapshots[d])s.snapshots[d]=s.tasks.filter(t=>t.date===d).map(t=>({...t}));if(!s.checks[d])s.checks[d]={};if(!s.records[d])s.records[d]=blankRecord();return s.snapshots[d]}
function taskList(d){return ensure(d)}
const checked=(d,id)=>!!s.checks[d]?.[id];
const percent=d=>{const a=taskList(d);return a.length?Math.round(a.filter(t=>checked(d,t.id)).length/a.length*100):0};
const timerMinutes=d=>s.sessions.filter(x=>x.date===d).reduce((sum,x)=>sum+(Number(x.minutes)||0),0);
let study=d=>Math.max(0,Number(s.records[d]?.manualStudy)||0);
const minutes=n=>formatDuration(n);
const weekStart=d=>{const x=date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
function occursOn(e,d){
 if(!e.title||!validDay(e.date)||!validDay(d))return false;
 if(!['daily','weekly'].includes(e.repeat))return e.date===d;
 if(d<e.date||(e.until&&d>e.until))return false;
 return e.repeat==='daily'||(Array.isArray(e.days)?e.days:[date(e.date).getDay()]).includes(date(d).getDay());
}
let events=d=>s.events.filter(e=>occursOn(e,d)).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
const repeatMark=e=>['daily','weekly'].includes(e.repeat)?' ↻':'';
function toast(text){$('toast').textContent=text;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2200)}
const icons={today:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 2.5 2.5L16 9"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',routine:'<path d="M3 12a9 9 0 1 1 3 6.7M3 17v-5h5"/><path d="m9 12 2 2 4-4"/>',records:'<path d="M4 19V9m6 10V5m6 14v-7m4 7V3"/>',diary:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18m3-13h5m-5 4h5"/>'};
const svg=k=>`<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[k]}</svg>`;
icons.law='<path d="M12 3v18M4 7h16M3 14l3-7 3 7H3Zm12 0 3-7 3 7h-6ZM7 21h10"/>';icons.plan=icons.today;icons.more=icons.diary;const nav=[['today','Today'],['routine','Rules & Routine'],['calendar','Calendar'],['law','Law Exam'],['diary','Journal']];
function renderNav(){for(const target of ['side-nav','mobile-nav'])$(target).innerHTML=nav.map(([id,label])=>`<button type="button" class="${target==='side-nav'?'nav-btn':'mobile-btn'} ${(activeTab===id||(activeTab==='plan'&&id==='today'))?'active':''}" data-action="tab" data-id="${id}" aria-current="${(activeTab===id||(activeTab==='plan'&&id==='today'))?'page':'false'}">${svg(id)}<span>${label}</span></button>`).join('')}
function setTab(t){if(!nav.some(x=>x[0]===t)&&!['more','plan'].includes(t))return;activeTab=t;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===t));renderNav();renderView();window.scrollTo({top:0,behavior:'instant'})}
function header(title,sub,button=''){return `<div class="page-header"><div><div class="eyebrow">DAILY DISCIPLINE / ${ESC(title)}</div><h1 class="page-title">${ESC(title)}</h1>${sub?`<p class="page-sub">${ESC(sub)}</p>`:''}</div>${button}</div>`}
function empty(title,sub){return `<div class="empty"><strong>${ESC(title)}</strong>${ESC(sub)}</div>`}
function renderReview(){const d=shift(now(),-1);const applicable=(new Date()).getHours()>=5;if(!applicable||!s.snapshots[d]||s.reviews[d]){$('review').innerHTML='';return}const missed=taskList(d).filter(t=>!checked(d,t.id));if(!missed.length){$('review').innerHTML='';return}$('review').innerHTML=`<form class="notice" id="review-form"><div class="notice-header"><div><div class="eyebrow" style="color:var(--amber)">MORNING REVIEW</div><h2 style="margin:5px 0 0;font-size:19px">Yesterday, revisited.</h2></div><span class="tag">${missed.length} UNFINISHED</span></div><p class="muted small">${fullDate(d)} の未完了やること。原因と次の一手を記録してください。</p><div class="stack">${missed.map(t=>`<div class="tag" style="width:fit-content">${ESC(t.title)}</div>`).join('')}</div><div class="grid-2" style="margin-top:12px"><div class="field"><label class="field-label" for="review-reason">なぜ達成できなかったか</label><textarea id="review-reason" required></textarea></div><div class="field"><label class="field-label" for="review-improve">次はどう改善するか</label><textarea id="review-improve" required></textarea></div></div><button class="btn btn-primary" type="submit">保存</button></form>`}

function renderTimelineEvents(d){
 const toMinute=value=>{const parts=String(value||'').split(':').map(Number);return parts.length===2&&parts.every(Number.isFinite)?parts[0]*60+parts[1]:NaN};
 const min=300,max=1320,pxPerMinute=72/60;
 const items=events(d).map(e=>({e,start:toMinute(e.start),end:toMinute(e.end)})).filter(x=>Number.isFinite(x.start)&&Number.isFinite(x.end)&&x.end>x.start&&x.start<max&&x.end>min).sort((a,b)=>a.start-b.start||a.end-b.end);
 const groups=[];let current=[],groupEnd=0;
 for(const entry of items){if(current.length&&entry.start>=groupEnd){groups.push(current);current=[];groupEnd=0}current.push(entry);groupEnd=Math.max(groupEnd,entry.end)}
 if(current.length)groups.push(current);
 const blocks=[];
 for(const group of groups){const laneEnds=[];
  for(const entry of group){let lane=laneEnds.findIndex(end=>end<=entry.start);if(lane<0){lane=laneEnds.length;laneEnds.push(entry.end)}else laneEnds[lane]=entry.end;entry.lane=lane}
  const total=laneEnds.length;
  for(const item of group){const top=(Math.max(item.start,min)-min)*pxPerMinute+2,height=Math.max(22,(Math.min(item.end,max)-Math.max(item.start,min))*pxPerMinute-4),width=100/total;
   blocks.push(`<button type="button" class="timeline-event x-colored" data-action="edit-event" data-date="${d}" data-id="${ESC(item.e.id)}" title="${ESC(item.e.start)}–${ESC(item.e.end)} ${ESC(item.e.title)}${repeatMark(item.e)} · ${ESC(eventCategoryName(item.e))}" style="${eventStyle(item.e)}top:${top}px;height:${height}px;left:calc(${width*item.lane}% + 4px);width:calc(${width}% - 8px)"><span class="drag-grip" data-drag-event="${ESC(item.e.id)}" data-date="${d}" role="button" tabindex="0" aria-label="予定を移動。上下キーで15分移動">⠿ 移動</span><span class="timeline-event-time num">${ESC(item.e.start)}–${ESC(item.e.end)}</span><strong>${ESC(item.e.title)}${repeatMark(item.e)}</strong>${item.e.note?`<small>${ESC(item.e.note)}</small>`:''}</button>`);
  }
 }
 return `<div class="timeline-events">${blocks.join('')}</div>`;
}

else if(mode==='週'){const start=weekStart(d),all=Array.from({length:7},(_,i)=>shift(start,i));content=`<div class="card"><div class="card-head"><div class="section-heading">Week View</div><span class="muted small">日付を選ぶと、その日の予定を表示します。</span></div><div class="week-scroll"><div class="week-grid">${all.map(x=>`<div class="day-column ${x===now()?'current':''}"><button class="day-open" data-action="pick-day" data-date="${x}">${shortDate(x)}<small>${days[date(x).getDay()]}</small></button>${events(x).map(e=>`<button class="week-event x-colored" style="${eventStyle(e)}" title="${ESC(eventCategoryName(e))}" data-action="edit-event" data-date="${x}" data-id="${ESC(e.id)}">${ESC(e.start)} ${ESC(e.title)}${repeatMark(e)}</button>`).join('')}<button class="icon-btn" style="margin-top:7px" data-action="new-event" data-date="${x}" aria-label="予定追加">＋</button></div>`).join('')}</div></div></div>`}
else{const dt=date(d),y=dt.getFullYear(),m=dt.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();content=`<div class="card"><div class="card-head"><div class="section-heading">Month View</div><span class="muted small">日付を選ぶと、その日の予定を表示します。</span></div><div class="calendar-days">${days.map(t=>`<div class="weekday">${t}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:n},(_,i)=>{const x=iso(new Date(y,m,i+1));return `<button type="button" class="month-day ${x===now()?'current':''}" data-action="pick-day" data-date="${x}"><span class="month-num">${i+1}</span>${events(x).slice(0,3).map(e=>`<span class="month-event x-colored" style="${eventStyle(e)}" title="${ESC(eventCategoryName(e))}">${ESC(e.title)}${repeatMark(e)}</span>`).join('')}${events(x).length>3?`<span class="month-event">+残り${events(x).length-3}件</span>`:''}</button>`}).join('')}</div></div>`}

function bucketData(mode){const entries=Object.entries(s.records).map(([d,r])=>({d,study:study(d),weight:r.weight===''?null:Number(r.weight),bodyFat:r.bodyFat===''?null:Number(r.bodyFat)})).sort((a,b)=>a.d.localeCompare(b.d));let keys=[];if(mode==='日')keys=Array.from({length:7},(_,i)=>shift(now(),i-6));else if(mode==='週'){const k=weekStart(now());keys=Array.from({length:8},(_,i)=>shift(k,(i-7)*7))}else{const current=date(now());keys=Array.from({length:6},(_,i)=>{const d=new Date(current.getFullYear(),current.getMonth()+i-5,1);return `${d.getFullYear()}-${p(d.getMonth()+1)}`})}

function actionsView(arr){return `<div class="stack">${arr.map(a=>`<div class="task-row ${a.done?'is-done':''}"><input class="check" type="checkbox" data-x-change="action-check" data-id="${a.id}" aria-label="${ESC(a.title)}" ${a.done?'checked':''}><div class="task-body"><div class="task-name">${ESC(a.title)}</div><div class="task-meta">${shortDate(a.date)} · ${ESC(categoryName(a.field))} · ${a.minutes}分予定 </div></div><div class="x-actions">${b('時間を設定','schedule',`data-kind="actions" ${ident(a)}`)}${b('編集','edit',`data-kind="actions" ${ident(a)}`)}${b('削除','delete',`data-kind="actions" ${ident(a)}`)}</div></div>`).join('')||empty('行動がありません','取り組むことと日付を決めましょう。')}</div>`}
function assignmentsView(){return `<div class="x-toolbar"><p class="muted">課題名・授業名・締切をシンプルに管理します。</p>${b('＋追加','edit','data-kind="assignments"','btn btn-primary')}</div><div class="stack">${X.assignments.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(a=>{const over=a.status!=='提出済み'&&a.due<now()+'T'+p(new Date().getHours())+':'+p(new Date().getMinutes());return listCard(a.title,`${ESC(a.course)} · 締切 ${ESC(formatDateTime(a.due))} · <span class="${over?'x-danger':''}">${over?'期限超過 · ':''}${ESC(a.status)}</span>`,`<div class="x-actions">${b(a.status==='提出済み'?'未提出に戻す':'提出済みにする','submitted',ident(a))}${b('作業枠を作る','schedule',`data-kind="assignments" ${ident(a)}`)}</div>`,editTools('assignments',a))}).join('')||empty('課題をまとめて把握する','授業名・締切を登録すると、今日の画面にも表示します。')}</div>`}
function reviewsView(){return `<div class="x-toolbar"><p class="muted">今日までの復習 ${X.reviews.filter(r=>r.next<=now()).length}件</p>${b('＋追加','edit','data-kind="reviews"','btn btn-primary')}</div><div class="stack">${X.reviews.slice().sort((a,b)=>a.next.localeCompare(b.next)).map(r=>listCard(r.title,`${ESC(r.subject)} · ${ESC(r.material)} · 次回 ${ESC(formatDate(r.next))} ${r.next<=now()?'· 復習待ち':''}`,`<p class="small">${ESC(r.reason||'誤答理由は未記入')}</p><div class="x-actions">${b('復習する','review-log',ident(r),'btn btn-primary')}${b('時間を設定','schedule',`data-kind="reviews" ${ident(r)}`)}</div>${r.logs?.length?`<details><summary>復習履歴 ${r.logs.length}回</summary>${r.logs.slice().reverse().map(l=>`<p class="small">${ESC(formatDate(l.date))} · ${ESC(l.result)}</p>`).join('')}</details>`:''}`,editTools('reviews',r))).join('')||empty('間違いを次の復習へ','教材や問題番号と、次に復習する日を登録できます。')}</div>`}
function booksView(){return `<div class="x-toolbar"><p class="muted">読みたい本から、今日の数ページへ。</p>${b('＋ 本を登録','edit','data-kind="books"','btn btn-primary')}</div><div class="x-grid">${X.books.map(v=>{const logs=activity('reading',v.id);return listCard(v.title,`${ESC(v.author||'著者未設定')} · ${ESC(v.status)} · ${ESC(v.field)}`,`<div class="x-book-pos">${v.position||0}<span> / ${v.mode==='読了率'?'100%':v.total?`${v.total}ページ`:'総ページ未設定'}</span></div><p class="small muted">累計 ${sum(logs,'pages')}ページ · ${sum(logs,'minutes')}分</p><p class="small">${ESC(v.memo||'')}</p><div class="x-actions">${b('続きから読む','reading-log',ident(v),'btn btn-primary')}${b('時間を設定','schedule',`data-kind="books" ${ident(v)}`)}</div>${logs.length?`<details><summary>読書の記録</summary>${logs.slice().reverse().map(l=>`<p class="small">${ESC(formatDate(l.date))} · ${l.pages||0}ページ · ${l.minutes||0}分<br>${ESC(l.note||'')}</p>`).join('')}</details>`:''}`,editTools('books',v))}).join('')||empty('読書を日々の習慣に','本・進捗・気づきをまとめて残します。')}</div>`}
function renderPlan(){const isLaw=planSection==='reviews';$('plan').innerHTML=header(isLaw?'Law Exam':'School Assignments',isLaw?'司法試験の学習・復習を整理する。':'学校の課題と締切を管理する。')+b('← 今日に戻る','back-today')+(isLaw?reviewsView():assignmentsView())}
function ruleDue(r,d){return d>=(r.since||'0000-00-00')&&r.days.includes(date(d).getDay())}
function ruleArchive(){const dates=Object.keys(X.ruleChecks).sort().reverse().slice(0,14);return dates.length?panel('最近のルール記録',dates.map(d=>`<div class="x-mini"><strong>${ESC(d)}</strong><span>${Object.entries(X.ruleChecks[d]).map(([id,state])=>ESC(X.ruleHistory[d]?.[id]||findX('rules',id)?.title||'削除済みルール')+'：'+ESC(state)).join('<br>')}</span>${b('削除','archive-remove',`data-kind="rule" data-date="${d}"`)}</div>`).join('')):''}
function dailyRulesCompletion(){const total=X.rules.length,done=X.rules.filter(r=>X.ruleChecks[now()]?.[r.id]==='実行').length,ratio=total?Math.round(done/total*100):0;return `<div class="card score section-spacer" aria-label="ルールの達成率 ${ratio}%"><div><div class="score-kicker">Rule Completion</div><div class="score-number num">${ratio}<span>%</span></div><div class="score-meta">${done} OF ${total} RULES COMPLETE</div></div><div class="score-ring" style="--progress:${ratio}%"><div class="score-ring-inner"><span>${total?`${total-done} LEFT`:'READY'}</span></div></div></div>`}
function rulesView(){return `${dailyRulesCompletion()}<div class="x-toolbar"><p class="muted small">自分のルールを書いて、できた日にチェック。</p>${b('＋追加','edit','data-kind="rules"','btn btn-primary')}</div><div class="stack">${X.rules.map(r=>{const done=X.ruleChecks[now()]?.[r.id]==='実行';return `<article class="x-item x-rule-item"><label class="x-rule-check"><input class="check" type="checkbox" data-x-change="rule-check" data-id="${ESC(r.id)}" aria-label="${ESC(r.title)}" ${done?'checked':''}><span class="x-rule-title ${done?'x-rule-done':''}">${ESC(r.title)}</span></label>${editTools('rules',r)}</article>`}).join('')||empty('自分のルールを書きましょう','毎日、できたルールにチェックを付けられます。')}</div>`}
function weekStats(w){const a=X.activities.filter(v=>inWeek(v.date,w));return {submitted:X.assignments.filter(v=>v.status==='提出済み'&&v.submittedDate&&inWeek(v.submittedDate,w)).length,law:sum(a.filter(v=>v.field==='法律学習'),'minutes'),workout:new Set(a.filter(v=>v.kind==='workout').map(v=>v.date)).size,pages:sum(a,'pages'),study:sum(a.filter(v=>['法律学習','大学'].includes(v.field)),'minutes'),rules:Object.entries(X.ruleChecks).filter(([d])=>inWeek(d,w)).reduce((n,[d,v])=>n+Object.values(v).filter(q=>q==='実行').length,0)}}
function statsHTML(w){const v=weekStats(w);return `<div class="x-stats">${[['法律学習',v.law,'分'],['課題提出',v.submitted,'件'],['ルール実行',v.rules,'回']].map(([l,n,u])=>`<div class="metric"><div class="metric-kicker">${l}</div><div class="metric-num">${n}<span class="metric-unit">${u}</span></div></div>`).join('')}</div>`}
function weeklyView(){const w=X.week,v=X.weekly[w]||{};return `<div class="x-toolbar"><label>対象週 <input id="x-week-picker" type="date" value="${w}"></label><span class="muted small">${formatPeriod(w,shift(w,6))}</span></div><div class="card section-spacer x-journal-goal"><div class="eyebrow">Weekly Goal</div><h2 class="card-title" style="margin:6px 0 16px">今週の目標</h2>${area('week-goal','今週、大切にすること',v.goal||'','form="x-weekly-form"')}</div><div class="card section-spacer"><h2 class="card-title">今週を振り返る</h2><form id="x-weekly-form" class="diary-fields" style="margin-top:18px">${area('won','できたこと',v.won)}${area('blocked','詰まった原因',v.blocked)}${area('next','来週変えること',v.next)}<button class="btn btn-primary" type="submit">保存</button></form></div>`}
function settingsView(){return `${cloudSyncSettings()}${categoryColorSettings()}<div class="card"><h2 class="card-title">保存とバックアップ</h2>${archiveUndoButton()}<p>この端末にも保存し、ログインすると同じアカウントのスマホ・PCと自動同期します。</p><div class="x-actions">${b('全データを書き出す','export','','btn btn-primary')}${b('バックアップを読み込む','import')}</div><input id="x-import-file" type="file" accept=".json,application/json" hidden><p class="muted small">取り込み前に内容と件数を確認し、現在の記録もバックアップします。取り込みは全体の置き換えです。</p></div><div class="card section-spacer"><h2 class="card-title">アプリとして使う</h2><p>このページをホーム画面に追加できます。同じメールアドレスでログインすると、端末間で記録を共有できます。</p><p class="muted small">iPhoneはSafariの共有メニュー、AndroidやPCはブラウザのアプリ追加メニューを確認してください。オフライン利用は一度オンラインで読み込んだ後に使えます。</p></div><div class="card section-spacer"><h2 class="card-title">試しながら始める</h2><p class="muted small">見本は「見本」ラベル付きで追加します。自分の記録と区別でき、まとめて削除できます。</p><div class="x-actions">${b('見本データを追加','samples')}${b('見本だけ削除','remove-samples')}</div></div>`}
function renderMore(){$('more').innerHTML=header('Settings','保存・バックアップとアプリの設定。')+settingsView()}
function workoutView(){const arr=activity('workout');return panel('筋トレの記録',`<p class="muted small">前回の内容を見ながら、重量・回数・セットを記録します。</p><div class="stack">${arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(v=>listCard(v.title,`${ESC(v.date)} · ${v.minutes}分`,`<div class="small">${(v.sets||[]).map(q=>`${ESC(q.exercise)} ${q.weight?ESC(q.weight)+'kg':'自重'} × ${q.reps}回`).join('<br>')}</div><p class="small muted">${ESC(v.note||'')}</p>`,editTools('workout',v))).join('')||empty('最初のトレーニングを記録','種目ごとに1セット1行で保存できます。')}</div>`,b('＋ 筋トレを記録','edit','data-kind="workout"','btn btn-primary'))}
function activityView(){return panel('学習の実績',`<div class="stack">${X.activities.filter(v=>v.kind!=='workout'&&v.kind!=='reading').slice().sort((a,b)=>b.date.localeCompare(a.date)).map(v=>listCard(v.title,`${ESC(v.date)} · ${ESC(v.field)} · ${v.minutes}分`,`<p class="small muted">${ESC(v.note||'')}</p>`,editTools('activities',v))).join('')||empty('実績がありません','行動・復習から記録するか、ここで手入力できます。')}</div>`,b('＋ 学習実績','edit','data-kind="activities"'))}
const oldToday=renderToday,oldRecords=renderRecords;
function todayTasks(){const d=now(),list=taskList(d),done=list.filter(t=>checked(d,t.id)).length;return panel('Today Task',`<div class="task-list">${list.map((t,i)=>`<div class="task-row ${checked(d,t.id)?'is-done':''}"><input class="check" type="checkbox" aria-label="${ESC(t.title)}" data-change="task-check" data-id="${ESC(t.id)}" ${checked(d,t.id)?'checked':''}><div class="task-body"><div class="task-name">${ESC(t.title)}</div><div class="task-meta">${ESC(t.category||'GENERAL')}${t.goal?` · 目標 ${t.goal}分`:''}</div></div><div class="row-actions"><button class="icon-btn" aria-label="上に移動" data-action="task-move" data-id="${ESC(t.id)}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="icon-btn" aria-label="下に移動" data-action="task-move" data-id="${ESC(t.id)}" data-dir="1" ${i===list.length-1?'disabled':''}>↓</button><button class="icon-btn" aria-label="やることを編集" data-action="edit-task" data-id="${ESC(t.id)}">✎</button></div></div>`).join('')||empty('今日のやることを追加しましょう','Today Taskはその日だけのリストです。毎日、新しく書き出しましょう。')}</div>`, `<button class="btn btn-primary" data-action="new-task">＋追加</button>`)}
function todayCompletion(){const list=taskList(now()),done=list.filter(t=>checked(now(),t.id)).length,ratio=percent(now());return `<div class="card score section-spacer" aria-label="やることの達成率 ${ratio}%"><div><div class="score-kicker">Task Completion</div><div class="score-number num">${ratio}<span>%</span></div><div class="score-meta">${done} OF ${list.length} TASKS COMPLETE</div></div><div class="score-ring" style="--progress:${ratio}%"><div class="score-ring-inner"><span>${list.length?`${list.length-done} LEFT`:'READY'}</span></div></div></div>`}
renderToday=function(){const d=now(),w=weekStart(d),arr=X.actions.filter(a=>!a.cancelled&&a.date===d),school=arr.filter(a=>a.field==='大学'),law=arr.filter(a=>a.field==='法律学習'),due=X.assignments.filter(a=>a.status!=='提出済み'&&a.due.slice(0,10)<=shift(d,3)).sort((a,b)=>a.due.localeCompare(b.due)),reviews=X.reviews.filter(r=>r.next<=d);
$('today').innerHTML=header('Today',fullDate(d))+`<div class="card"><div class="card-head"><h2 class="card-title x-bilingual">Daily Commitment<span class="x-section-jp">今日の約束</span></h2>${b('編集','promise')}</div><p class="x-promise">${ESC(X.promises[d]||'今日、やり切ることをひとつ決める。')}</p></div>`+
`<div class="x-grid x-study-grid section-spacer">`+panel('School Assignments',`${school.length?actionsView(school):''}<div class="stack">${due.map(a=>`<div class="x-mini"><div><strong>${ESC(a.title)}</strong><div class="muted small">${ESC(a.course)} · 締切 ${ESC(formatDateTime(a.due))}</div></div>${b('開く','jump','data-section="assignments"')}</div>`).join('')||(!school.length?'<p class="muted small">今日の学校のやること・3日以内の未提出課題はありません。</p>':'')}</div>`,`<div class="x-actions">${b('＋追加','edit','data-kind="actions" data-field="大学"')}${b('一覧','jump','data-section="assignments"')}</div>`)+
panel('Law Exam',`${law.length?actionsView(law):''}<div class="stack">${reviews.map(r=>`<div class="x-mini"><div><strong>${ESC(r.title)}</strong><div class="muted small">${ESC(r.subject)} · 復習日 ${ESC(formatDate(r.next))}</div></div>${b('復習する','review-log',ident(r))}</div>`).join('')||(!law.length?'<p class="muted small">今日の学習行動・復習待ちはありません。</p>':'')}</div>`,`<div class="x-actions">${b('＋追加','edit','data-kind="actions" data-field="法律学習"')}${b('一覧','jump','data-section="reviews"')}</div>`)+`</div>`+todayCompletion()+todayTasks()+
(arr.some(a=>!['大学','法律学習'].includes(a.field))?panel('そのほかの行動',actionsView(arr.filter(a=>!['大学','法律学習'].includes(a.field)))):'')+
panel('今日の予定',`<div class="stack">${events(d).map(e=>`<button type="button" class="history-row x-colored" style="${eventStyle(e)}" data-action="edit-event" data-date="${d}" data-id="${ESC(e.id)}"><span class="time-chip">${ESC(e.start)}–${ESC(e.end)}</span><strong>${ESC(e.title)}</strong></button>`).join('')||'<p class="muted small">予定はありません。</p>'}</div>`,`<button class="btn btn-quiet" data-action="calendar-today">カレンダーへ</button>`);
};
renderRecords=function(){oldRecords();$('records').innerHTML=`<div class="x-toolbar"><span class="muted small">日別の学習合計には、新しく入力した学習実績も含まれます。</span></div>`+archiveUndoButton()+$('records').innerHTML+activityView()};
function modal(kind,obj={},extra={}){const defs={goals:'週目標',actions:'やること',assignments:'学校課題',reviews:'復習項目',books:'本',rules:'ルール',activities:'学習実績',workout:'筋トレ実績','review-log':'復習の記録','reading-log':'読書の記録',promise:'今日の約束'};let body='';const g=extra.goal?findX('goals',extra.goal):null;const shared=()=>f('date','日付',obj.date||now(),'date','required')+categoryField(obj.field||g?.field||'法律学習');
if(kind==='goals')body=f('title','今週の目標',obj.title,'text','required maxlength="160"')+categoryField(obj.field||'法律学習')+f('week','週の開始日',obj.week||X.week,'date','required')+f('longGoal','長期目標',obj.longGoal)+sel('unit','集計の単位',['分','回','日'],obj.unit||'分')+f('target','目標値',obj.target||60,'number','required min="1" step="1"')+f('minimum','忙しい日の最低ライン',obj.minimum);
if(kind==='actions')body=f('title','やること',obj.title,'text','required maxlength="160"')+f('date','日付',obj.date||now(),'date','required')+`<input type="hidden" id="x-field" value="${ESC(obj.field||'法律学習')}"><div class="field"><span class="field-label">カテゴリ</span><strong>${ESC(categoryName(obj.field||'法律学習'))}</strong></div>`+f('minutes','予定時間（分）',obj.minutes||30,'number','min="0" max="1440"');
if(kind==='assignments')body=f('title','課題名',obj.title,'text','required')+f('course','科目名',obj.course,'text','required')+f('due','提出期限',obj.due||now()+'T23:59','datetime-local','required')+f('requiredMinutes','必要時間（分）',obj.requiredMinutes||60,'number','required min="15" max="60000" step="15"')+sel('status','状態',['未着手','進行中','提出済み'],obj.status||'未着手');
if(kind==='reviews')body=f('title','学習範囲・問題番号',obj.title,'text','required')+f('subject','科目',obj.subject,'text','required')+f('material','教材・出典',obj.material)+f('next','次回復習日',obj.next||now(),'date','required')+area('reason','間違えた理由・理解メモ',obj.reason);
if(kind==='books')body=f('title','本のタイトル',obj.title,'text','required')+f('author','著者',obj.author)+sel('field','分野',['読書','法律学習'],obj.field||'読書')+sel('status','状態',['読みたい','読書中','読了','中断'],obj.status||'読みたい')+sel('mode','進捗の記録方法',['ページ','読了率'],obj.mode||'ページ')+f('total','総ページ数 任意',obj.total||'','number','min="1"')+f('position','現在ページ または 読了率 %',obj.position||0,'number','min="0"')+area('memo','読む目的・メモ',obj.memo);
if(kind==='rules')body=area('title','ルール',obj.title,'required maxlength="1000"');
if(kind==='activities')body=f('title','取り組んだこと',obj.title||g?.title,'text','required')+shared()+f('minutes','実施時間（分）',obj.minutes||0,'number','required min="0" max="1440"')+f('count','完了回数',obj.count??1,'number','min="0"')+area('note','メモ',obj.note);

const syncCanonical=value=>{if(value===undefined)return '<absent>';if(value===null||typeof value!=='object')return JSON.stringify(value);if(Array.isArray(value))return '['+value.map(syncCanonical).join(',')+']';return '{'+Object.keys(value).filter(k=>!['__proto__','prototype','constructor'].includes(k)).sort().map(k=>JSON.stringify(k)+':'+syncCanonical(value[k])).join(',')+'}'};

function mergeSyncData(base,local,remote,preference='local'){
 const conflicts=[];
 function walk(b,l,r,path){
  if(syncEqual(l,r))return syncClone(l);
  if(syncEqual(l,b))return syncClone(r);
  if(syncEqual(r,b))return syncClone(l);
  const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
  const keyed=v=>Array.isArray(v)&&v.every(q=>isObj(q)&&typeof q.id==='string');
  if(keyed(l)&&keyed(r)&&(b===undefined||keyed(b))){
   const bm=new Map((b||[]).map(v=>[v.id,v])),lm=new Map(l.map(v=>[v.id,v])),rm=new Map(r.map(v=>[v.id,v]));
   const ids=[...new Set([...l.map(v=>v.id),...r.map(v=>v.id),...(b||[]).map(v=>v.id)])];return ids.map(id=>walk(bm.get(id),lm.get(id),rm.get(id),path+' / '+id)).filter(v=>v!==undefined);

 }

}

moveEvent=function(id,d,delta){const e=s.events.find(v=>v.id===id);if(!e||!occursOn(e,d))return false;const duration=minuteTool(e.end)-minuteTool(e.start),start=Math.max(300,Math.min(1320-duration,minuteTool(e.start)+Math.round(delta/15)*15));if(duration<=0||duration>1020||start===minuteTool(e.start))return false;const prior={start:e.start,end:e.end},moved=singleOccurrence(id,d,{date:d,start:timeTool(start),end:timeTool(start+duration)});if(!moved)return false;const key=outcomeKey(moved.id,d);if(!X.eventOutcomes[key])X.eventOutcomes[key]={id:key,eventId:moved.id,date:d,title:moved.title,planStart:prior.start,planEnd:prior.end,status:'pending',actualStart:'',actualEnd:''};xsave('この日の予定を移動しました');return true};
// Availability uses the same occurrence rules as the visible calendar.
function freeSlots(d,start='05:00',end='22:00',at=new Date()){let lo=Math.max(300,minuteTool(start)),hi=Math.min(1320,minuteTool(end));if(!validateDay(d)||!Number.isFinite(lo)||!Number.isFinite(hi)||hi<=lo||d<iso(at))return [];if(d===iso(at))lo=Math.max(lo,Math.ceil((at.getHours()*60+at.getMinutes()+at.getSeconds()/60)/15)*15);const blocked=events(d).map(e=>[minuteTool(e.start),minuteTool(e.end)]).filter(([a,b])=>Number.isFinite(a)&&Number.isFinite(b)&&b>a&&b>lo&&a<hi).sort((a,b)=>a[0]-b[0]);const slots=[];let cursor=lo;for(const [a,b] of blocked){if(a>cursor)slots.push({start:cursor,end:Math.min(a,hi)});cursor=Math.max(cursor,b);if(cursor>=hi)break}if(cursor<hi)slots.push({start:cursor,end:hi});return slots.filter(v=>v.end>v.start)}
function freeTimeView(){const slots=freeSlots(s.calendarDate),total=slots.reduce((n,v)=>n+v.end-v.start,0);return `<div class="card section-spacer"><div class="card-head"><div><div class="eyebrow">Free Time</div><h2 class="card-title">空き時間 <span class="muted">${minutes(total)}</span></h2></div></div><p class="muted small">05:00–22:00の予定が入っていない時間です。今日の過ぎた時間は含めません。</p><div class="smart-free">${slots.map(v=>`<button class="tag" type="button" data-action="slot-add" data-date="${s.calendarDate}" data-start="${timeTool(v.start)}" data-end="${timeTool(v.end)}">${timeTool(v.start)}–${timeTool(v.end)} · ${minutes(v.end-v.start)}</button>`).join('')||'<span class="muted small">空き時間はありません。</span>'}</div></div>`}

function isSchoolEvent(e){return e.sourceKind==='assignments'||e.sourceKind==='actions'&&findX('actions',e.sourceId)?.field==='大学'||X.categories.find(c=>c.id===e.categoryId)?.field==='大学'}
function schoolMinutes(d){const scheduled=events(d),eventMinutes=scheduled.filter(isSchoolEvent).reduce((n,e)=>n+Math.max(0,minuteTool(e.end)-minuteTool(e.start)),0);const unscheduled=X.actions.filter(a=>a.date===d&&a.field==='大学'&&!a.cancelled&&!scheduled.some(e=>e.sourceKind==='actions'&&e.sourceId===a.id));return eventMinutes+sum(unscheduled,'minutes')}
function allocatedAssignmentMinutes(id,at=new Date()){let total=0;for(const e of s.events.filter(e=>e.sourceKind==='assignments'&&e.sourceId===id&&!['daily','weekly'].includes(e.repeat))){const o=X.eventOutcomes[outcomeKey(e.id,e.date)];if(o?.status==='skipped')continue;if(o?.status==='done'||new Date(e.date+'T'+e.end)>at)total+=Math.max(0,minuteTool(e.end)-minuteTool(e.start))}return total}
function planAssignment(id,input,at=new Date()){const a=findX('assignments',id);if(!a||a.status==='提出済み')return {error:'提出済みの課題は割り振れません',slots:[]};const required=Number(input.minutes),start=input.start,end=input.end,first=input.first,due=new Date(a.due);if(!Number.isInteger(required)||required<15||required>60000||required%15||!validateDay(first)||first<iso(at)||!/^\d{2}:\d{2}$/.test(start)||!/^\d{2}:\d{2}$/.test(end)||start<'05:00'||end>'22:00'||end<=start||!Number.isFinite(due.getTime()))return {error:'時間・開始日を確認してください。必要時間は15分単位、作業枠は05:00–22:00です',slots:[]};const allocated=allocatedAssignmentMinutes(id,at),slots=[];let remaining=Math.max(0,required-allocated);for(let i=0,d=first;i<366&&d<=a.due.slice(0,10)&&remaining;i++,d=shift(first,i)){let capacity=Math.max(0,120-schoolMinutes(d));let hi=end;if(d===a.due.slice(0,10))hi=timeTool(Math.min(minuteTool(end),Math.floor((due.getHours()*60+due.getMinutes())/15)*15));for(const gap of freeSlots(d,start,hi,at)){let cursor=Math.ceil(gap.start/15)*15,limit=Math.floor(gap.end/15)*15;while(remaining>=15&&capacity>=15&&limit-cursor>=15){const take=Math.min(60,remaining,capacity,limit-cursor);slots.push({date:d,start:timeTool(cursor),end:timeTool(cursor+take),minutes:take});remaining-=take;capacity-=take;cursor+=take}if(!remaining||capacity<15)break}}return {slots,remaining,allocated,required,first,start,end,assignmentId:id}}

a-label="日付ごとの学習計画"><div class="law-list-header"><span>日付</span><span>教材・やる内容</span></div>${lawMonthDays().map(d=>{const rows=items.filter(a=>a.date===d),dt=date(d);return `<div class="law-day ${d===now()?'is-today':''} ${dt.getDay()===0?'is-sunday':dt.getDay()===6?'is-saturday':''}"><div class="law-day-label"><strong>${dt.getDate()}<span>日</span></strong><small>${days[dt.getDay()]}</small>${d===now()?'<em>今日</em>':''}</div><div class="law-day-plans">${rows.length?rows.map(a=>lawPlanRow(a)).join(''):'<span class="law-unplanned">予定なし</span>'}</div>${lawButton('new','＋',`data-date="${d}" aria-label="${ESC(formatShortDate(d))}に計画を追加"`)}</div>`}).join('')}</section>`}
function validatedLawEntry(input){const id=String(input.id||''),existing=id?X.actions.find(a=>a.id===id&&a.field==='法律学習'):null;if(id&&!existing)return {error:'この計画は変更されています。開き直してください。'};const subject=lawSubjectId(input.subject),title=String(input.title||'').trim(),material=String(input.material||'').trim();if(!validateDay(input.date))return {error:'正しい日付を指定してください。'};if(!subject)return {error:'7科目から科目を選んでください。'};if(!title||title.length>160)return {error:'やる内容を1〜160文字で入力してください。'};if(material.length>160)return {error:'教材名は160文字以内で入力してください。'};if(existing&&input.date!==existing.date&&s.events.some(e=>e.sourceKind==='actions'&&e.sourceId===id&&['daily','weekly'].includes(e.repeat)))return {error:'繰り返し予定と連動しています。先にカレンダーの繰り返しを調整してください。'};return {entry:{...existing,id:id||uid(),field:'法律学習',date:input.date,subject,title,material,minutes:existing?.minutes||0,done:!!existing?.done}}}
function saveLawEntries(inputs,baseline=null){if(!Array.isArray(inputs)||inputs.length>300)return {error:'一度に保存できる計画は300件までです。'};const next=[],seen=new Set();for(const input of inputs){if(!input.id&&!String(input.title||'').trim()&&!String(input.material||'').trim())continue;if(input.id&&seen.has(input.id))return {error:'同じ計画が重複しています。開き直してください。'};if(input.id)seen.add(input.id);if(baseline&&input.id&&baseline[input.id]!==JSON.stringify(X.actions.find(a=>a.id===input.id)))return {error:'編集中に計画が変更されました。開き直して確認してください。'};const result=validatedLawEntry(input);if(result.error)return result;next.push(result.entry)}
 for(const entry of next){const i=X.actions.findIndex(a=>a.id===entry.id),old=i<0?null:X.actions[i];for(const event of s.events.filter(e=>e.sourceKind==='actions'&&e.sourceId===entry.id)){event.title=entry.title;if(old&&old.date!==entry.date&&!['daily','weekly'].includes(event.repeat))event.date=entry.date}if(i<0)X.actions.push(entry);else X.actions[i]=entry;updateLawHistory(entry)}persist();return {entries:next}}
function updateLawHistory(entry){const key=linkedTaskId('action',entry.id,entry.date),snapshot=s.snapshots[entry.date]?.find(t=>t.id===key);if(snapshot){snapshot.title=entry.title;snapshot.goal=entry.minutes;s.checks[entry.date]??={};s.checks[entry.date][key]=entry.done}const task=s.tasks.find(t=>t.id===key);if(task){task.title=entry.title;task.goal=entry.minutes}}
function setLawDone(id,done){const a=findX('actions',id);if(!a||a.field!=='法律学習')return false;a.done=!!done;updateLawHistory(a);persist();return true}
function deleteLawEntry(id){const a=findX('actions',id);if(!a||a.field!=='法律学習')return false;addTrash('actions',a);X.actions=X.actions.filter(v=>v.id!==id);for(const e of s.events.filter(e=>e.sourceKind==='actions'&&e.sourceId===id)){addTrash('event',e);s.events=s.events.filter(v=>v.id!==e.id)}persist();return true}
function openLawEditor(id='',d=now()){const a=id?findX('actions',id):null;if(id&&!a)return toast('計画が見つかりません。一覧を開き直してください。');$('x-dialog-content').innerHTML=`<form id="law-plan-form" data-id="${ESC(id)}"><div class="modal-head"><h2 class="modal-title">司法試験の計画を${id?'編集':'追加'}</h2>${b('✕','close')}</div><div class="form-grid"><div class="field"><label class="field-label" for="law-plan-date">日付</label><input type="date" id="law-plan-date" required value="${ESC(a?.date||d)}"></div><div class="field"><label class="field-label" for="law-plan-subject">科目</label><select id="law-plan-subject" required>${lawSubjectOptions(a?.subject||(lawSubjectId(lawSubject)?lawSubject:''))}</select></div><div class="field wide"><label class="field-label" for="law-plan-material">教材（任意）</label><input id="law-plan-material" maxlength="160" value="${ESC(a?.material||'')}" placeholder="例：論文問題集"></div><div class="field wide"><label class="field-label" for="law-plan-title">やる内容</label><textarea id="law-plan-title" required maxlength="160" placeholder="例：第1問〜第3問を解く">${ESC(a?.title||'')}</textarea></div></div><p class="hint">この日付に割り当てます。今日の分はToday・Today Taskと連動します。${a?.done?' この計画は完了済みです。編集してもチェックは保持します。':''}</p><div class="modal-footer">${id?lawButton('delete-editor','削除',`data-id="${ESC(id)}"`):''}${b('キャンセル','close')}<button type="submit" class="btn btn-primary">保存</button></div></form>`;$('x-dialog').showModal()}
function lawBulkRow(a={},d){const token=uid();return `<div class="law-bulk-entry" data-law-bulk-row data-id="${ESC(a.id||'')}" data-date="${d}"><label class="field-label" for="law-bulk-title-${token}">${a.id?'登録済みの内容':'やる内容'}</label><input id="law-bulk-title-${token}" data-law-input="title" maxlength="160" value="${ESC(a.title||'')}" placeholder="例：第1問〜第3問"><label class="field-label law-material-label" for="law-bulk-material-${token}">教材（任意）</label><input id="law-bulk-material-${token}" data-law-input="material" maxlength="160" value="${ESC(a.material||'')}" placeholder="教材名">${a.done?'<span class="small muted">✓ 完了済み・チェックを保持</span>':''}</div>`}
function openLawBulk(subject=lawSubject){if(!lawSubjectId(subject)){$('x-dialog-content').innerHTML=`<form id="law-bulk-choose"><div class="modal-head"><h2 class="modal-title">月の計画をまとめて入力</h2>${b('✕','close')}</div><p class="muted">${formatMonth(lawMonth)}の計画を入力する科目を選んでください。</p><div class="field"><label class="field-label" for="law-bulk-subject">科目</label><select id="law-bulk-subject" required>${lawSubjectOptions()}</select></div><div class="modal-footer"><button class="btn btn-primary" type="submit">日付ごとの入力へ</button></div></form>`;$('x-dialog').showModal();return}lawSubject=lawSubjectId(subject);if(activeTab==='law')renderLawPlanner();const entries=lawItems(lawMonth,lawSubject);lawBulkBase=Object.fromEntries(entries.map(a=>[a.id,JSON.stringify(a)]));$('x-dialog-content').innerHTML=`<form id="law-bulk-form" data-subject="${lawSubject}" data-month="${lawMonth}"><div class="modal-head"><h2 class="modal-title">${formatMonth(lawMonth)} · ${lawSubjectName(lawSubject)}</h2>${b('✕','close')}</div><p class="law-bulk-help">1か月分を日付ごとに入力できます。空欄の追加欄は保存しません。登録済みの計画は編集でき、削除は一覧から行います。</p><div class="field" style="margin-bottom:18px"><label class="field-label" for="law-bulk-default-material">新しい計画に共通の教材（任意）</label><input id="law-bulk-default-material" maxlength="160" placeholder="各日の教材が空欄の場合に使用します"></div><div class="law-bulk-days">${lawMonthDays().map(d=>`<section class="law-bulk-day"><h3>${formatShortDate(d)}（${days[date(d).getDay()]}）</h3><div data-law-bulk-day="${d}">${entries.filter(a=>a.date===d).map(a=>lawBulkRow(a,d)).join('')}${lawBulkRow({},d)}</div>${lawButton('bulk-row','＋この日にもう1件',`data-date="${d}"`)}</section>`).join('')}</div><div class="modal-footer law-bulk-footer">${b('キャンセル','close')}<button type="submit" class="btn btn-primary">まとめて保存</button></div></form>`;$('x-dialog').showModal()}
function readLawBulk(){const subject=$('law-bulk-form').dataset.subject;return Array.from(document.querySelectorAll('[data-law-bulk-row]')).map(row=>({id:row.dataset.id,date:row.dataset.date,subject,title:row.querySelector('[data-law-input="title"]').value,material:row.querySelector('[data-law-input="material"]').value||(!row.dataset.id&&row.querySelector('[data-law-input="title"]').value.trim()?$('law-bulk-default-material').value:'')}))}
function navigateLaw(month=now().slice(0,7),subject='all'){if(validLawMonth(month))lawMonth=month;lawSubject=['all','unassigned',...lawSubjects.map(s=>s[0])].includes(subject)?subject:'all';setTab('law')}
function stepLawMonth(n){const dt=date(lawMonth+'-01');dt.setMonth(dt.getMonth()+n);const next=iso(dt).slice(0,7);if(validLawMonth(next))lawMonth=next;renderLawPlanner()}
const lawStudyBase=studyCard;studyCard=function(field){if(field!=='法律学習')return lawStudyBase(field);const rows=lawItems(now().slice(0,7),'all').filter(a=>a.date===now());return `<section class="card law-daily-card"><div class="card-head"><h2 class="card-title x-bilingual">Law Exam<span class="x-section-jp">司法試験</span></h2><div class="x-actions">${lawButton('new','＋追加',`data-date="${now()}"`)}${lawButton('open','一覧')}</div></div><div class="smart-label">Today's Actions</div><div class="law-daily-list" aria-label="今日の司法試験の計画">${rows.map(a=>lawPlanRow(a,true)).join('')||'<p class="smart-empty">今日の計画はありません。Law Examで日付ごとに割り当てられます。</p>'}</div><p class="flow-link-note">月間計画の今日の分を表示 · Today Taskと連動</p></section>`};
const lawModalBase=modal;modal=function(kind,obj={},extra={}){if(kind==='actions'&&obj.field==='法律学習')return openLawEditor(obj.id||'',obj.date||now());return lawModalBase(kind,obj,extra)};
openLawIndex=function(){navigateLaw()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-law]');if(!el)return;const a=el.dataset.law,id=el.dataset.id;if(a==='open')navigateLaw();if(a==='subject'){lawSubject=el.dataset.subject;renderLawPlanner()}if(a==='month-prev')stepLawMonth(-1);if(a==='month-next')stepLawMonth(1);if(a==='this-month'){lawMonth=now().slice(0,7);renderLawPlanner()}if(a==='new')openLawEditor('',el.dataset.date||lawDefaultDate());if(a==='edit')openLawEditor(id);if(a==='bulk')openLawBulk();if(a==='bulk-row'){const d=el.dataset.date;if(validateDay(d))document.querySelector(`[data-law-bulk-day="${d}"]`)?.insertAdjacentHTML('beforeend',lawBulkRow({},d))}if(a==='delete'||a==='delete-editor'){if(deleteLawEntry(id)){if(a==='delete-editor')$('x-dialog').close();render();toast('計画をごみ箱に移動しました')}}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='law-month'&&validLawMonth(el.value)){lawMonth=el.value;renderLawPlanner()}if(el.dataset.lawCheck&&setLawDone(el.dataset.lawCheck,el.checked)){render();toast('完了状態を保存しました')}});
document.addEventListener('submit',e=>{const form=e.target;if(form.id==='law-bulk-choose'){e.preventDefault();openLawBulk($('law-bulk-subject').value);return}if(form.id!=='law-plan-form'&&form.id!=='law-bulk-form')return;e.preventDefault();const rows=form.id==='law-bulk-form'?readLawBulk():[{id:form.dataset.id,date:$('law-plan-date').value,subject:$('law-plan-subject').value,title:$('law-plan-title').value,material:$('law-plan-material').value}];const result=saveLawEntries(rows,form.id==='law-bulk-form'?lawBulkBase:null);if(result.error){alert(result.error);syncSession.draft=true;syncSession.draftForm=form;return}if(activeTab==='law'&&form.id==='law-plan-form'){lawMonth=rows[0].date.slice(0,7);if(lawSubject!=='all')lawSubject=rows[0].subject}$('x-dialog').close();render();toast(result.entries.length+'件の計画を保存しました')});

// Compact rows pair course and task name with the deadline; actions live in details.
function assignmentDeadline(a){const [day,time='']=String(a.due||'').split('T');if(!validateDay(day))return '未設定';const dt=date(day),prefix=day.slice(0,4)!==now().slice(0,4)?dt.getFullYear()+'/':'';return prefix+(dt.getMonth()+1)+'/'+dt.getDate()+(time?' '+time.slice(0,5):'')}
function schoolAssignmentView(a){const overdue=a.status!=='提出済み'&&new Date(a.due)<new Date();return `<button type="button" class="school-assignment-row ${overdue?'is-overdue':''} ${a.status==='提出済み'?'is-submitted':''}" data-school="details" ${ident(a)} title="${ESC((a.title||'')+' · '+formatDateTime(a.due)+' · '+(a.status||'未着手'))}" aria-label="${ESC((a.course||'科目未設定')+'：'+a.title+'、提出期限 '+formatDateTime(a.due)+'の詳細を開く')}"><span class="school-row-name"><span class="school-row-course">${ESC(a.course||'科目未設定')}</span><span class="school-row-title">${ESC(a.title||'')}</span></span><time class="school-row-due" datetime="${ESC(a.due||'')}">${ESC(assignmentDeadline(a))}</time></button>`}
function schoolColumnLabels(){return '<div class="school-columns"><span>科目名・課題名</span><span>提出期限</span></div>'}
const schoolStudyBase=studyCard;studyCard=function(field){if(field!=='大学')return schoolStudyBase(field);const pending=X.assignments.filter(a=>a.status!=='提出済み').slice().sort((a,b)=>String(a.due).localeCompare(String(b.due)));return `<section class="card school-focus"><div class="card-head"><h2 class="card-title x-bilingual">School Assignments<span class="x-section-jp">学校課題</span></h2><div class="x-actions">${b('＋追加','edit','data-kind="assignments"')}${b('一覧','jump','data-section="assignments"')}</div></div>${schoolColumnLabels()}<div class="school-deadlines" aria-label="未提出の学校課題">${pending.map(a=>schoolAssignmentView(a)).join('')||'<p class="school-empty">未提出の課題はありません。</p>'}</div></section>`};
assignmentsView=function(){const pending=X.assignments.filter(a=>a.status!=='提出済み').slice().sort((a,b)=>String(a.due).localeCompare(String(b.due))),submitted=X.assignments.filter(a=>a.status==='提出済み').slice().sort((a,b)=>String(b.due).localeCompare(String(a.due)));return `<div class="x-toolbar"><p class="muted">行を押すと詳細・操作を開きます。</p>${b('＋追加','edit','data-kind="assignments"','btn btn-primary')}</div><div class="school-list-panel">${schoolColumnLabels()}<div class="school-assignment-list">${pending.map(a=>schoolAssignmentView(a)).join('')||'<p class="school-empty">未提出の課題はありません。</p>'}</div></div>${submitted.length?`<details class="school-submitted"><summary>提出済み ${submitted.length}件</summary>${submitted.map(a=>schoolAssignmentView(a)).join('')}</details>`:''}`};
function openSchoolDetails(id){const a=findX('assignments',id);if(!a)return;$('x-dialog-content').innerHTML=`<section class="school-details" data-id="${ESC(id)}"><div class="modal-head"><h2 class="modal-title">${ESC(a.course||'科目未設定')}</h2>${b('✕','close')}</div><p class="school-detail-deadline">提出期限 ${ESC(formatDateTime(a.due))}</p><p class="school-detail-title">${ESC(a.title)}</p><p class="muted small">${ESC(a.status||'未着手')} · 必要時間 ${formatDuration(a.requiredMinutes||0)}</p><div class="school-detail-tools">${b('編集','edit',`data-kind="assignments" ${ident(a)}`)}<button class="btn btn-quiet" type="button" data-smart="plan-assignment" ${ident(a)}>作業日を決める</button>${b(a.status==='提出済み'?'未提出に戻す':'提出済みにする','submitted',ident(a))}${b('削除','delete',`data-kind="assignments" ${ident(a)}`)}</div></section>`;$('x-dialog').showModal()}
const schoolHandleBase=handleX;handleX=function(el){const details=$('x-dialog-content').querySelector?.('.school-details'),id=details?.dataset.id,result=schoolHandleBase(el);if(id&&el.dataset.x==='submitted')openSchoolDetails(id);if(id&&el.dataset.x==='delete'&&!findX('assignments',id))$('x-dialog').close();return result};
document.addEventListener('click',e=>{const el=e.target.closest('[data-school]');if(el?.dataset.school==='details')openSchoolDetails(el.dataset.id)});

ensure(now());persist();render();let lastDate=now(),lastReviewHour=new Date().getHours();setInterval(()=>{const current=now(),h=new Date().getHours();if(lastDate!==current){lastDate=current;ensure(current);persist();render()}else if(lastReviewHour<5&&h>=5){renderReview()}lastReviewHour=h},1000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker unavailable',err));
})();
</script>
