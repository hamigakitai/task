// Shared three-way merge; entity lists merge by ID, daily maps by key.
const syncCanonical=value=>{if(value===undefined)return '<absent>';if(value===null||typeof value!=='object')return JSON.stringify(value);if(Array.isArray(value))return '['+value.map(syncCanonical).join(',')+']';return '{'+Object.keys(value).filter(k=>!['__proto__','prototype','constructor'].includes(k)).sort().map(k=>JSON.stringify(k)+':'+syncCanonical(value[k])).join(',')+'}'};
const syncEqual=(a,b)=>syncCanonical(a)===syncCanonical(b);
const syncClone=value=>value===undefined?undefined:JSON.parse(JSON.stringify(value));
function mergeSyncData(base,local,remote,preference='local'){
 const conflicts=[];
 function walk(b,l,r,path){
  if(syncEqual(l,r))return syncClone(l);
  if(syncEqual(l,b))return syncClone(r);
  if(syncEqual(r,b))return syncClone(l);
  const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
  const keyed=v=>Array.isArray(v)&&v.every(q=>isObj(q)&&typeof q.id==='string');
  if(keyed(l)&&keyed(r)&&(b===undefined||keyed(b))){
   const bm=new Map((b||[]).map(v=>[v.id,v])),lm=new Map(l.map(v=>[v.id,v])),rm=new Map(r.map(v=>[v.id,v]));
   const ids=[...new Set([...l.map(v=>v.id),...r.map(v=>v.id),...(b||[]).map(v=>v.id)])];return ids.map(id=>walk(bm.get(id),lm.get(id),rm.get(id),path+' / '+id)).filter(v=>v!==undefined);
  }
  if(isObj(l)&&isObj(r)&&(b===undefined||isObj(b))){const out=Object.create(null);for(const k of new Set([...Object.keys(b||{}),...Object.keys(l),...Object.keys(r)])){if(['__proto__','prototype','constructor'].includes(k))continue;const value=walk(b?.[k],l[k],r[k],path+' / '+k);if(value!==undefined)out[k]=value}return out}
  conflicts.push(path||'記録全体');return syncClone(preference==='remote'?r:l);
 }
 return {data:walk(base,local,remote,''),conflicts};
}

async function syncFetch(options={}){if(!cloudAuthClient)return Response.json({error:'auth_unavailable'},{status:503});const {data:{session}}=await cloudAuthClient.auth.getSession();if(!session)return Response.json({error:'sign_in_required'},{status:401});const control=new AbortController(),timer=setTimeout(()=>control.abort(),15000);try{const body=options.body?JSON.parse(options.body):null;const result=await cloudAuthClient.rpc(body?'discipline_sync_write':'discipline_sync_read',body?{expected_revision:body.baseRevision,operation:body.operationId,snapshot:body.data}:{}).abortSignal(control.signal);if(result.error)return Response.json({error:result.error.message?.includes('APP_UPDATE_REQUIRED')?'app_update_required':result.error.code||'sync_error'},{status:result.status||500});if(result.data?.conflict)return Response.json(result.data,{status:409});return Response.json(result.data)}finally{clearTimeout(timer)}}

 }

 if(hasUnsavedSyncDraft()){setSyncStatus('入力中・保存後に同期します');return}
 const sent=syncClone(local),operationId=uid();const write=await syncFetch({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseRevision:cloud.revision,operationId,data:sent})});
 if(write.status===409){retry=true;setSyncStatus('他の端末の変更を確認中');return}

function reconcileLinkedTasks(){const d=now();ensure(d);const before=JSON.stringify([s.tasks,s.snapshots[d],s.checks[d]]),sources=linkedSources(d),ids=new Set(sources.map(t=>t.id));s.tasks=s.tasks.filter(t=>!(t.date===d&&t.linkKind&&!ids.has(t.id)));s.snapshots[d]=s.snapshots[d].filter(t=>!t.linkKind||ids.has(t.id));for(const src of sources){const {done,...task}=src;const i=s.tasks.findIndex(t=>t.id===task.id),j=s.snapshots[d].findIndex(t=>t.id===task.id);if(i<0)s.tasks.push(task);else s.tasks[i]={...s.tasks[i],...task};if(j<0)s.snapshots[d].push(copyTool(task));else s.snapshots[d][j]={...s.snapshots[d][j],...task};s.checks[d][task.id]=done}return before!==JSON.stringify([s.tasks,s.snapshots[d],s.checks[d]])}

function renderLawPlanner(){const all=lawItems(lawMonth,'all'),items=lawItems(),completed=items.filter(a=>a.done).length,unassigned=all.filter(a=>!lawSubjectId(a.subject)).length,ratio=items.length?Math.round(completed/items.length*100):0;const pills=[['all','全科目'],...lawSubjects,...(unassigned?[['unassigned','科目未設定']]:[])];$('law').innerHTML=header('Law Exam','7科目の月間計画を立て、今日の勉強につなげる。')+`<div class="law-month-toolbar"><div class="law-month-control">${lawButton('month-prev','‹','aria-label="前の月"')}<div class="field"><label class="field-label" for="law-month">計画する月</label><input id="law-month" type="month" value="${lawMonth}" aria-label="計画する月"></div>${lawButton('month-next','›','aria-label="次の月"')}</div>${lawButton('this-month','今月')}<div class="law-main-actions">${lawButton('bulk','月の計画をまとめて入力')}${lawButton('new','＋計画',`data-date="${lawDefaultDate()}"`,true)}</div></div><div class="law-subjects" role="group" aria-label="科目で絞り込む">${pills.map(([id,label])=>{const subset=lawItems(lawMonth,id);return `<button type="button" data-law="subject" data-subject="${id}" aria-pressed="${lawSubject===id}" class="law-subject-button ${lawSubject===id?'selected':''}"><span>${label}</span><small>${subset.filter(a=>a.done).length}/${subset.length}</small></button>`}).join('')}</div><section class="card law-month-summary"><div><div class="eyebrow">Monthly Plan</div><h2 class="card-title">${formatMonth(lawMonth)} · ${lawSubject==='all'?'全科目':lawSubjectName(lawSubject)}</h2><p class="muted small">${completed} / ${items.length} 件完了${items.some(a=>a.minutes)?' · 予定 '+formatDuration(sum(items,'minutes')):''}</p></div><div class="law-progress" role="progressbar" aria-label="選択中の月間計画の完了率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${ratio}"><span style="width:${ratio}%"></span></div><p class="law-plan-help">${lawSubject==='all'?'科目を選ぶと、その科目だけの計画を確認できます。':'各日の「＋」から追加、まとめて入力から1か月分を編集できます。'} 今日の分はTodayに自動表示します。未完了の計画は翌日へ自動移動しません。</p></section><section class="card law-calendar-list" aria-label="日付ごとの学習計画"><div class="law-list-header"><span>日付</span><span>教材・やる内容</span></div>${lawMonthDays().map(d=>{const rows=items.filter(a=>a.date===d),dt=date(d);return `<div class="law-day ${d===now()?'is-today':''} ${dt.getDay()===0?'is-sunday':dt.getDay()===6?'is-saturday':''}"><div class="law-day-label"><strong>${dt.getDate()}<span>日</span></strong><small>${days[dt.getDay()]}</small>${d===now()?'<em>今日</em>':''}</div><div class="law-day-plans">${rows.length?rows.map(a=>lawPlanRow(a)).join(''):'<span class="law-unplanned">予定なし</span>'}</div>${lawButton('new','＋',`data-date="${d}" aria-label="${ESC(formatShortDate(d))}に計画を追加"`)}</div>`}).join('')}</section>`}
function validatedLawEntry(input){const id=String(input.id||''),existing=id?X.actions.find(a=>a.id===id&&a.field==='法律学習'):null;if(id&&!existing)return {error:'この計画は変更されています。開き直してください。'};const subject=lawSubjectId(input.subject),title=String(input.title||'').trim(),material=String(input.material||'').trim();if(!validateDay(input.date))return {error:'正しい日付を指定してください。'};if(!subject)return {error:'7科目から科目を選んでください。'};if(!title||title.length>160)return {error:'やる内容を1〜160文字で入力してください。'};if(material.length>160)return {error:'教材名は160文字以内で入力してください。'};if(existing&&input.date!==existing.date&&s.events.some(e=>e.sourceKind==='actions'&&e.sourceId===id&&['daily','weekly'].includes(e.repeat)))return {error:'繰り返し予定と連動しています。先にカレンダーの繰り返しを調整してください。'};return {entry:{...existing,id:id||uid(),field:'法律学習',date:input.date,subject,title,material,minutes:existing?.minutes||0,done:!!existing?.done}}}
function saveLawEntries(inputs,baseline=null){if(!Array.isArray(inputs)||inputs.length>300)return {error:'一度に保存できる計画は300件までです。'};const next=[],seen=new Set();for(const input of inputs){if(!input.id&&!String(input.title||'').trim()&&!String(input.material||'').trim())continue;if(input.id&&seen.has(input.id))return {error:'同じ計画が重複しています。開き直してください。'};if(input.id)seen.add(input.id);if(baseline&&input.id&&baseline[input.id]!==JSON.stringify(X.actions.find(a=>a.id===input.id)))return {error:'編集中に計画が変更されました。開き直して確認してください。'};const result=validatedLawEntry(input);if(result.error)return result;next.push(result.entry)}
 for(const entry of next){const i=X.actions.findIndex(a=>a.id===entry.id),old=i<0?null:X.actions[i];for(const event of s.events.filter(e=>e.sourceKind==='actions'&&e.sourceId===entry.id)){event.title=entry.title;if(old&&old.date!==entry.date&&!['daily','weekly'].includes(event.repeat))event.date=entry.date}if(i<0)X.actions.push(entry);else X.actions[i]=entry;updateLawHistory(entry)}persist();return {entries:next}}
function updateLawHistory(entry){const key=linkedTaskId('action',entry.id,entry.date),snapshot=s.snapshots[entry.date]?.find(t=>t.id===key);if(snapshot){snapshot.title=entry.title;snapshot.goal=entry.minutes;s.checks[entry.date]??={};s.checks[entry.date][key]=entry.done}const task=s.tasks.find(t=>t.id===key);if(task){task.title=entry.title;task.goal=entry.minutes}}

function openLawEditor(id='',d=now()){const a=id?findX('actions',id):null;if(id&&!a)return toast('計画が見つかりません。一覧を開き直してください。');$('x-dialog-content').innerHTML=`<form id="law-plan-form" data-id="${ESC(id)}"><div class="modal-head"><h2 class="modal-title">司法試験の計画を${id?'編集':'追加'}</h2>${b('✕','close')}</div><div class="form-grid"><div class="field"><label class="field-label" for="law-plan-date">日付</label><input type="date" id="law-plan-date" required value="${ESC(a?.date||d)}"></div><div class="field"><label class="field-label" for="law-plan-subject">科目</label><select id="law-plan-subject" required>${lawSubjectOptions(a?.subject||(lawSubjectId(lawSubject)?lawSubject:''))}</select></div><div class="field wide"><label class="field-label" for="law-plan-material">教材（任意）</label><input id="law-plan-material" maxlength="160" value="${ESC(a?.material||'')}" placeholder="例：論文問題集"></div><div class="field wide"><label class="field-label" for="law-plan-title">やる内容</label><textarea id="law-plan-title" required maxlength="160" placeholder="例：第1問〜第3問を解く">${ESC(a?.title||'')}</textarea></div></div><p class="hint">この日付に割り当てます。今日の分はToday・Today Taskと連動します。${a?.done?' この計画は完了済みです。編集してもチェックは保持します。':''}</p><div class="modal-footer">${id?lawButton('delete-editor','削除',`data-id="${ESC(id)}"`):''}${b('キャンセル','close')}<button type="submit" class="btn btn-primary">保存</button></div></form>`;$('x-dialog').showModal()}

function renderArgumentLibrary(){if(!lawSubjectId(argSubject))argSubject='civil';if(argFolder&&argumentFolder(argFolder)?.subject!==argSubject)argFolder='';const scope=argumentScope(),active=argSearch||argFilter!=='all';$('law').innerHTML=header('Law Exam','論証をまとめて、繰り返し覚える。')+argumentTabs()+`<section class="arg-explorer"><div class="arg-explorer-toolbar"><select id="arg-subject" aria-label="科目">${lawSubjectOptions(argSubject,false)}</select><div class="arg-explorer-actions">${argButton('learn-folder','学習',`title="このフォルダの論証を学習" ${scope.length?'':'disabled'}`,true)}<details class="arg-add-menu"><summary class="btn btn-quiet">＋追加</summary><div>${argButton('new-folder','フォルダ')}${argButton('new-card','論証')}${argButton('bulk','論証をまとめて入力')}${argButton('import-file','ファイルから取り込む')}</div></details></div></div><div class="arg-explorer-address">${argButton('parent-folder','↑',`aria-label="一つ上のフォルダへ" ${argFolder?'':'disabled'}`)}${argumentBreadcrumbs()}${argFolder?`<details class="arg-folder-options"><summary aria-label="このフォルダの操作">•••</summary><div>${argButton('edit-folder','名前・場所を変更',`data-id="${ESC(argFolder)}"`)}</div></details>`:''}</div><details class="arg-explorer-search" ${active?'open':''}><summary>検索・絞り込み${active?'（設定中）':''}</summary><div class="arg-search-controls"><div class="field"><label class="field-label" for="arg-search">論証を検索</label><input id="arg-search" type="search" value="${ESC(argSearch)}" placeholder="条文名・論点・本文"></div><div class="field"><label class="field-label" for="arg-filter">表示</label><select id="arg-filter">${[['all','すべて'],['new','未学習'],['studied','学習済み'],['due','今日の復習'],['retry','未定着'],['review','要確認'],['mastered','定着']].map(([v,l])=>`<option value="${v}" ${argFilter===v?'selected':''}>${l}</option>`).join('')}</select></div></div>${argButton('clear-search','条件をクリア')}</details><div id="arg-results">${argumentListMarkup()}</div></section>`}

function renderArgumentReview(){const due=argumentDue(argReviewSubject),scope=argumentScope(argReviewSubject,''),fresh=scope.filter(c=>!argumentState(c).studied),weak=scope.filter(c=>['retry','review'].includes(argumentState(c).grade));$('law').innerHTML=header('Law Exam','今日の論証を、少しずつ確実に。')+argumentTabs()+`<section class="card arg-review-home"><div class="eyebrow">Argument Review</div><div class="arg-review-home-top"><div><h2>今日の復習 <span>${due.length}件</span></h2><p class="muted small">${ESC(formatDate(now()))}</p></div><div class="field"><label class="field-label" for="arg-review-subject">科目</label><select id="arg-review-subject"><option value="all" ${argReviewSubject==='all'?'selected':''}>全科目</option>${lawSubjectOptions(argReviewSubject,false)}</select></div></div><div class="arg-review-start">${argButton('start-due','復習を始める',due.length?'':'disabled',true)}${argButton('start-five','5件だけ',due.length?'':'disabled')}${argButton('read-due','読むだけ',due.length?'':'disabled')}</div><div class="arg-review-counts"><div><span>未学習</span><strong>${fresh.length}<small>件</small></strong>${argButton('start-new','未学習から学ぶ',fresh.length?'':'disabled')}</div><div><span>未定着・要確認</span><strong>${weak.length}<small>件</small></strong>${argButton('start-weak','苦手だけ復習',weak.length?'':'disabled')}</div></div><p class="arg-review-explanation">論点を見て思い出し、本文を開いて判定します。復習日は判定に応じた目安です。論証一覧から手動でも変更できます。登録しただけの論点は、学習するまで復習対象に入りません。</p><a class="arg-direct-link" href="?view=argument-review">この復習画面を直接開く</a></section><section class="card arg-review-queue"><h2 class="card-title">復習する論点</h2>${due.slice(0,30).map(c=>`<article class="arg-queue-row"><div><small>${ESC(lawSubjectName(c.subject))}${c.statute?' · '+ESC(c.statute):''}</small><strong>${ESC(c.issue)}</strong><div class="arg-meta">${argumentStatus(c)}</div></div>${argButton('learn-one','学習',ident(c))}</article>`).join('')||'<p class="muted">今日の復習はありません。未学習の論点を学ぶか、論証を追加できます。</p>'}${due.length>30?`<p class="muted small">ほか${due.length-30}件も「復習を始める」から finishFocusTask=function(id,version,d=taskDay()){if(d!==taskDay())return {error:'対象日が変わりました。一覧を開き直してください。'};const t=taskList(d).find(t=>t.id===id);if(!t)return {error:'このタスクは削除・変更されています。'};if(version&&focusTaskVersion(t,d)!==version)return {error:'タスクが更新されています。開き直して内容を確認してください。'};return setTaskCompletion(d,id,true)};
const datedLawDoneBase=setLawDone;setLawDone=function(id,done){const a=findX('actions',id);if(!a)return false;const before=X.taskCompletionEvents;appendTaskCompletion({id:linkedTaskId('action',id,a.date),date:a.date},a.date,done);const result=datedLawDoneBase(id,done);if(!result)X.taskCompletionEvents=before;return result};
function selectTaskDay(d,redraw=true){if(!validateDay(d))return false;taskDateOverride=d;taskRenderedDate=d;reconcileTaskDays();if(redraw){persist();renderToday();scrollAppTop()}return true}
function useAutomaticTaskDay(redraw=true){taskDateOverride=null;taskRenderedDate=taskDayDefault();reconcileTaskDays();if(redraw){persist();renderToday();scrollAppTop()}}
function taskDayBar(){const d=taskDay(),tomorrow=shift(now(),1),label=d===now()?'今日':d===tomorrow?'明日':d<now()?'過去の記録':'先の日の計画';return `<section class="task-day-bar"><div><strong>タスクの日付 <span>${label}</span></strong><p>${ESC(formatDate(d))} · 21:00に翌日分へ切り替え${taskDateOverride?'（日付を選択中）':''}</p></div><div class="task-day-controls"><button class="btn btn-quiet" type="button" data-task-day="today">今日</button><button class="btn btn-quiet" type="button" data-task-day="tomorrow">明日</button><label class="sr-only" for="task-day-picker">タスクの対象日</label><input id="task-day-picker" type="date" value="${d}" aria-label="タスクの対象日">${taskDateOverride?'<button class="btn btn-quiet" type="button" data-task-day="auto">自動に戻す</button>':''}</div><p class="task-day-note">未完了は過去のすべての日から引き継ぎます。ルーティン・日記の日付は変わりません。</p></section>`}
const taskDateRenderBase=renderToday;renderToday=function(){taskDateRenderBase();const root=$('today'),bar=taskDayBar();root.innerHTML=root.innerHTML.replace(/(<div class="x-grid x-study-grid[^\"]*">)/,bar+'$1')};
const datedOpenTaskBase=openTask;openTask=function(id){datedOpenTaskBase(id);const d=taskDay();$('task-form').dataset.taskDate=d;$('task-planned-date').value=d;$('task-planned-date').readOnly=!!id;$('task-date-hint').textContent=id?'別の日に割り当てる場合は、一覧の日付を切り替えてから編集してください。':'前日から、明日以降のタスクを追加できます。';$('task-dialog-title').textContent=formatShortDate(d)+'のやることを'+(id?'編集':'追加')};
carryBadge=function(t){if(!t.carryOriginDate)return '';const label=t.carryOriginDate===shift(taskDay(),-1)?'前日からの未完了':formatShortDate(t.carryOriginDate)+'からの未完了';return `<span class="carry-badge">${ESC(label)}</span>`};
removeTask=function(id){const d=taskEditDay(),t=ensureTaskDay(d).find(t=>t.id===id)||s.tasks.find(t=>t.id===id);if(!t)return;if(t.linkKind==='action'){const a=findX('actions',t.linkId);if(a){addTrash('actions',a);X.actions=X.actions.filter(v=>v.id!==a.id)}}else if(t.linkKind==='event'){for(const e of taskAppointments(t,d))removeTaskAppointment(e,d)}else{addTrash('task',copyTool(t),{date:d,checked:checked(d,id)});X.taskDismissals={...X.taskDismissals,[taskRootKey(t,d)]:true};if(t.carryOriginDate){X.carryDismissals[d]??={};X.carryDismissals[d][id]=true}s.tasks=s.tasks.filter(v=>v.id!==id);s.snapshots[d]=s.snapshots[d].filter(v=>v.id!==id);delete s.checks[d][id]}for(const e of taskAppointments(t,d))removeTaskAppointment(e,d);persist();$('task-dialog').close();render();toast('やることをごみ箱に移動しました')};
const taskDateRestoreBase=restoreTrash;restoreTrash=function(id){const e=X.trashEntries.find(v=>v.id===id),key=e?.kind==='task'?taskRootKey(e.value,e.date||e.value.date):'',old=X.taskDismissals;if(key)X.taskDismissals={...old,[key]:false};const result=taskDateRestoreBase(id);if(!result)X.taskDismissals=old;return result};
function correctCarryTask(id,completedDate,d=taskDay()){const current=ensureTaskDay(d).find(t=>t.id===id);if(!current?.carryOriginDate||!validateDay(completedDate)||completedDate<current.carryOriginDate||completedDate>now())return {error:'元の日付から今日までの実施日を選んでください。'};const before=taskMutationSnapshot(),root=taskRoot(current,d),historicId=completedDate===root.date?root.id:'carry-'+completedDate+'-'+root.date+'-'+root.id;ensureTaskDay(completedDate);if(!s.snapshots[completedDate].some(t=>t.id===historicId)){const historic={...current,id:historicId,date:completedDate};if(completedDate===root.date){delete historic.carryOriginDate;delete historic.carryOriginId;if(current.carrySourceKind){historic.linkKind=current.carrySourceKind;historic.linkId=current.carrySourceId;historic.linkDate=current.carrySourceDate}}s.snapshots[completedDate].push(historic);s.tasks.push(copyTool(historic))}X.taskCorrections.push({id:uid(),date:completedDate,taskId:historicId,title:current.title,completed:true,correctedAt:new Date().toISOString()});const result=setTaskCompletion(completedDate,historicId,true);if(result.error)restoreTaskMutation(before);return result}
correctTask=function(d,id,completed){if(!validateDay(d)||d>=now()||!ensureTaskDay(d).some(t=>t.id===id))return false;const before=taskMutationSnapshot(),t=s.snapshots[d].find(t=>t.id===id);X.taskCorrections.push({id:uid(),date:d,taskId:id,title:t.title,completed:!!completed,correctedAt:new Date().toISOString()});const result=setTaskCompletion(d,id,completed);if(result.error)restoreTaskMutation(before);return !!result.ok};
confirmCarryWasDone=function(id){const t=ensureTaskDay(taskDay()).find(t=>t.id===id);return !!t?.carryOriginDate&&!!correctCarryTask(id,t.carryOriginDate).ok};
function openCarryCorrection(id){const t=taskList(taskDay()).find(t=>t.id===id);if(!t?.carryOriginDate)return;$('x-dialog-content').innerHTML=`<form id="carry-correction-form" data-id="${ESC(id)}" data-date="${taskDay()}"><div class="modal-head"><h2 class="modal-title">実施済みに訂正</h2>${b('✕','close')}</div><p>${ESC(t.title)}</p><div class="field"><label class="field-label" for="carry-completed-date">実際に行った日</label><input id="carry-completed-date" type="date" min="${t.carryOriginDate}" max="${now()}" value="${t.carryOriginDate}"></div><p class="muted small">選んだ日の実施済みとして記録し、今後の未完了リストから外します。</p><p id="carry-correction-error" class="hint" role="status"></p><div class="modal-footer"><button type="submit" class="btn btn-primary">実施済みに訂正</button></div></form>`;$('x-dialog').showModal()}
const datedProblemMarkupBase=problemArgumentsMarkup;problemArgumentsMarkup=function(options={}){return datedProblemMarkupBase(options).replace('今日覚える論証',taskDay()===now()?'今日覚える論証':'対象日の論証')};
const datedFocusMarkupBase=focusMarkup;focusMarkup=function(t,tasks){return datedFocusMarkupBase(t,tasks).replace('<p class="muted small">',`<p class="muted small">${ESC(formatDate(taskDay()))} · `)};
function taskDayTick(at=new Date()){if(taskDateOverride||taskRenderedDate===taskDayDefault(at))return false;if(hasUnsavedSyncDraft()||document.querySelector('dialog[open]'))return false;taskRenderedDate=taskDayDefault(at);persist();if(activeTab==='today')renderToday();else if(activeTab==='law'&&argumentSection==='review'&&!argSession)renderArgumentReview();return true}
setInterval(()=>taskDayTick(),1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')taskDayTick()});
window.addEventListener('change',e=>{const el=e.target;if(el.dataset?.change==='task-check'){e.preventDefault();e.stopImmediatePropagation();const d=el.dataset.taskDate||taskDay(),result=setTaskCompletion(d,el.dataset.id,el.checked);if(result.error)toast(result.error);renderView()}if(el.id==='task-day-picker'){e.stopImmediatePropagation();selectTaskDay(el.value)}},true);
window.addEventListener('click',e=>{const correction=e.target.closest?.('[data-carry-done]');if(correction){e.preventDefault();e.stopImmediatePropagation();openCarryCorrection(correction.dataset.carryDone);return}const el=e.target.closest?.('[data-task-day],[data-action="task-calendar-day"]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();if(el.dataset.action==='task-calendar-day'){s.calendarDate=taskDay();s.calendarMode='日';persist();setTab('calendar');return}const action=el.dataset.taskDay;if(action==='auto')useAutomaticTaskDay();else selectTaskDay(action==='today'?now():shift(now(),1))},true);
window.addEventListener('submit',e=>{if(e.target.id!=='task-form')return;e.preventDefault();e.stopImmediatePropagation();const result=saveTimedTask({id:$('task-id').value,title:$('task-title').value,category:$('task-category').value,goal:$('task-goal').value,scheduled:$('task-scheduled').checked,start:$('task-start').value,end:$('task-end').value,date:$('task-planned-date').value});if(result.error){alert(result.error);return}syncSession.draft=false;syncSession.draftForm=null;selectTaskDay(result.task.date,false);$('task-dialog').close();render();toast('対象日のやることと予定を保存しました')},true);
document.addEventListener('submit',e=>{if(e.target.id!=='carry-correction-form')return;e.preventDefault();const result=correctCarryTask(e.target.dataset.id,$('carry-completed-date').value,e.target.dataset.date);if(result.error){$('carry-correction-error').textContent=result.error;return}syncSession.draft=false;syncSession.draftForm=null;$('x-dialog').close();render();toast('実施済みに訂正しました')});

ensure(now());persist();render();let lastDate=now(),lastReviewHour=new Date().getHours();setInterval(()=>{const current=now(),h=new Date().getHours();if(lastDate!==current){lastDate=current;ensure(current);persist();render()}else if(lastReviewHour<5&&h>=5){renderReview()}lastReviewHour=h},1000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(err=>console.warn('Service worker unavailable',err));
})();
