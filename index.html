<body>
<div class="app">
<aside class="sidebar"><div class="logo"><span class="logo-mark">D<span style="font-size:11px;vertical-align:top">.</span></span><span>Daily Discipline</span></div><div><div class="side-hint">WORKSPACE</div><nav class="side-nav" id="side-nav"></nav></div><div class="side-footer"><b>BUILD YOUR DAY.</b>Small steps. Serious progress.<div style="margin-top:13px;color:#56686f">LOCAL-FIRST · PRIVATE BY DESIGN</div></div></aside>
<div class="shell"><header class="topbar"><div class="top-brand"><span class="logo-mark">D.</span> Daily Discipline</div><div class="top-right"><span class="time-label-top">MAKE TODAY COUNT</span><span class="today-pill"><span class="live-dot"></span><span id="current-date"></span></span></div></header><main class="content"><div id="review"></div><section class="view active" id="today"></section><section class="view" id="calendar"></section><section class="view" id="routine"></section><section class="view" id="diary"></section><section class="view" id="plan"></section><section class="view" id="more"></section></main></div>

</div>
<dialog id="x-dialog"><div class="modal-content" id="x-dialog-content"></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="task-dialog" aria-labelledby="task-dialog-title"><form id="task-form" class="modal-content"><div class="modal-head"><h2 class="modal-title" id="task-dialog-title">New task</h2><button class="icon-btn" type="button" data-close>✕</button></div><input type="hidden" id="task-id"><div class="field"><label class="field-label" for="task-title">TASK NAME</label><input id="task-title" maxlength="160" required placeholder="例：民法の問題演習"></div><div class="form-grid" style="margin-top:14px"><div class="field"><label class="field-label" for="task-category">CATEGORY</label><select id="task-category" required></select></div><div class="field"><label class="field-label" for="task-new-category">カテゴリを追加</label><div class="x-category-add"><input id="task-new-category" maxlength="40" placeholder="新しいカテゴリ名"><button type="button" class="btn btn-quiet" data-x="add-category" data-input="task-new-category" data-target="task-category">＋ 追加</button></div></div><div class="field"><label class="field-label" for="task-goal">TARGET (MIN)</label><input id="task-goal" type="number" min="0" max="1440" value="0"></div><div class="field wide"><p class="hint" style="margin:0">今日の日付にだけ保存されます。翌日には引き継ぎません。<br>定期的な予定はCalendarで繰り返しを設定できます。</p></div></div><div class="modal-footer"><button type="button" class="btn btn-danger hide" id="task-delete">削除</button><button type="button" class="btn btn-quiet" data-close>Cancel</button><button type="submit" class="btn btn-primary">Save task</button></div></form></dialog>

<script>
(()=>{'use strict';
const KEY='dailyDiscipline_v6', BACKUP='dailyDiscipline_backup_before_v5_2';
const $=id=>document.getElementById(id);
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
const now=()=>iso(new Date());
const date=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const validDay=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(date(s).getTime());
const shift=(s,n)=>{const d=date(s);d.setDate(d.getDate()+n);return iso(d)};
const days=['日','月','火','水','木','金','土'],allDays=[0,1,2,3,4,5,6],groups=['朝','昼','夜'];
const fullDate=s=>date(s).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
const shortDate=s=>{const d=date(s);return `${d.getMonth()+1}/${d.getDate()}`};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();

if(a==='add-category')return addCategory(el.dataset.input,el.dataset.target);
if(a==='close')return $('x-dialog').close();
if(a==='edit'){const obj=id?findX(kind==='workout'?'activities':kind,id):{field:el.dataset.field};if(obj)modal(kind,obj,{goal:el.dataset.goal});}
if(a==='delete'){const k=kind==='workout'?'activities':kind;if(confirm('この記録を削除しますか？関連する過去の実績は残ります。')){X[k]=X[k].filter(v=>v.id!==id);xsave('削除しました')}}
if(a==='plan-tab'){planSection=el.dataset.section;renderPlan()}
if(a==='journal-tab'){journalSection=['daily','weekly','monthly','archive'].includes(el.dataset.section)?el.dataset.section:'daily';renderDiary()}
if(a==='routine-tab'){routineSection=el.dataset.section==='routine'?'routine':'rules';renderRoutine()}
if(a==='back-today')setTab('today');
if(a==='journal-open'){const d=el.dataset.date;if(kind==='weekly'){journalSection='weekly';X.week=d}else if(kind==='monthly'){journalSection='monthly';journalMonth=d}else{journalSection='daily';s.diaryDate=d}persist();renderDiary()}
if(a==='more-tab'){if(el.dataset.section==='weekly'){journalSection='weekly';setTab('diary');return}moreSection=el.dataset.section;if(['routine','diary'].includes(moreSection))setTab(moreSection);else renderMore()}
if(a==='jump'){planSection=el.dataset.section;setTab('plan')}
if(a==='open-settings'){moreSection='settings';setTab('more')}
if(a==='open-weekly'){X.week=weekStart(now());journalSection='weekly';setTab('diary')}
if(a==='schedule')scheduleX(kind,id);
if(a==='submitted'){const v=findX('assignments',id);v.status=v.status==='提出済み'?'進行中':'提出済み';v.submittedDate=v.status==='提出済み'?now():'';xsave()}
if(a==='review-log')modal(a,findX('reviews',id));
if(a==='reading-log')modal(a,findX('books',id));
if(a==='action-log'){const v=findX('actions',id),old=X.activities.find(q=>q.ref===id&&q.date===v.date);modal('activities',old||{title:v.title,date:v.date,field:v.field,minutes:v.minutes},{ref:id})}
if(a==='rule-state'){X.ruleChecks[now()]??={};X.ruleChecks[now()][id]=el.dataset.state;X.ruleHistory[now()]??={};X.ruleHistory[now()][id]=findX('rules',id).title;xsave()}
if(a==='promise')modal('promise');
if(a==='copy-sets'){const v=activity('workout').at(-1);if(v)$('x-sets').value=v.sets.map(q=>`${q.exercise} | ${q.weight} | ${q.reps}`).join('\n')}
if(a==='carry'){const v=findX('actions',id);if(!v.replanned){X.actions.push({...v,id:uid(),date:shift(v.date,7),important:false,done:false,from:id,replanned:false});v.replanned=true;xsave('翌週へ再計画しました')}}
if(a==='cancel-action'){const v=findX('actions',id);if(confirm('この行動を取りやめますか？')){v.cancelled=true;v.important=false;xsave('取りやめとして保存しました')}}
if(a==='export')exportX();
if(a==='import')$('x-import-file').click();
if(a==='samples')samples();
if(a==='remove-samples'){const ids=new Set(['goals','actions','assignments','reviews','books','rules'].flatMap(k=>X[k].filter(v=>v.sample).map(v=>v.id)));for(const k of ['goals','actions','assignments','reviews','books','rules'])X[k]=X[k].filter(v=>!v.sample);X.activities=X.activities.filter(v=>!ids.has(v.ref));xsave('見本を削除しました')}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-x]');if(el)handleX(el)});
document.addEventListener('submit',e=>{if(e.target.id==='x-monthly-form'){e.preventDefault();X.monthly[journalMonth]={goal:getv('month-goal'),won:getv('month-won'),blocked:getv('month-blocked'),next:getv('month-next'),savedAt:new Date().toISOString()};xsave('月次ジャーナルを保存しました')}if(e.target.id==='x-form'){e.preventDefault();saveForm(e.target)}if(e.target.id==='x-weekly-form'){e.preventDefault();X.weekly[X.week]={goal:getv('week-goal'),won:getv('won'),blocked:getv('blocked'),next:getv('next'),savedAt:new Date().toISOString()};xsave('今週の振り返りを保存しました')}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='event-category')updateEventCategoryColor();if(el.id==='event-category-color'){const c=X.categories.find(c=>c.id===$('event-category').value),color=validColor(el.value);if(c&&color){c.color=color;xsave('カテゴリの色を保存しました')}}if(el.dataset.xChange==='category-color'){const c=X.categories.find(c=>c.id===el.dataset.id),color=validColor(el.value);if(c&&color){c.color=color;xsave('カテゴリの色を保存しました')}}if(el.id==='x-month-picker'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(el.value)){journalMonth=el.value;renderDiary()}if(el.id==='x-week-picker'&&validateDay(el.value)){X.week=weekStart(el.value);xsave()}
if(el.dataset.xChange==='rule-check'){const r=findX('rules',el.dataset.id);if(!r)return;X.ruleChecks[now()]??={};X.ruleChecks[now()][r.id]=el.checked?'実行':'未実行';X.ruleHistory[now()]??={};X.ruleHistory[now()][r.id]=r.title;xsave('チェックを保存しました')}
if(el.dataset.xChange==='action-check'){const v=findX('actions',el.dataset.id);v.done=el.checked;xsave('完了状態を保存しました')}
if(el.dataset.xChange==='step-check'){const v=findX('assignments',el.dataset.id);v.steps[Number(el.dataset.index)].done=el.checked;if(v.status==='未着手')v.status='進行中';xsave()}
if(el.id==='x-import-file'&&el.files[0]){try{const raw=JSON.parse(await el.files[0].text());if(!raw||!Array.isArray(raw.tasks)||!Array.isArray(raw.events)||!raw.diaries||!raw.records)throw Error('形式が違います');const count=`タスク ${raw.tasks.length}件、予定 ${raw.events.length}件、日記 ${Object.keys(raw.diaries).length}件`;if(confirm(`${count}\n現在の記録を書き出してから、取り込み内容に置き換えます。続けますか？`)){exportX(s,'before-import');const next=normalize(raw);if(!next.v6||!Array.isArray(next.v6.activities))throw Error('追加データの形式が違います');localStorage.setItem(KEY,JSON.stringify(next));location.reload()}}catch(err){alert('読み込めませんでした。バックアップJSONを確認してください。')}}});


// English for navigation and concise accents; Japanese for guidance and form labels.
// Only display text changes. User content and stored enum values remain untouched.
const UI_EN={"大学":"学校課題","大学課題":"学校課題","法律学習":"Law Exam","法律の復習":"Law Exam","今日": "Today", "カレンダー": "Calendar", "計画": "Plan", "記録": "Records", "その他": "More", "振り返りと設定": "Reflect & Refine", "日記": "Journal", "ルーティン": "Routine", "編集": "Edit", "保存する": "Save", "キャンセル": "Cancel", "決める・変更": "Set / Edit", "New task": "タスクを追加", "Edit task": "タスクを編集", "New event": "予定を追加", "Edit event": "予定を編集", "New routine": "ルーティンを追加", "Edit routine": "ルーティンを編集", "Cancel": "Cancel", "Save task": "保存する", "Save event": "保存する", "Save routine": "保存する", "Save record": "記録を保存", "Save journal →": "日記を保存 →", "TASK NAME": "タスク名", "CATEGORY": "カテゴリ", "TARGET (MIN)": "目標時間（分）", "REPEAT ON": "実施曜日", "EVENT NAME": "予定名", "DATE": "日付", "START": "開始時刻", "END": "終了時刻", "NOTE": "メモ", "SECTION": "時間帯", "TIME": "時刻", "ROUTINE NAME": "ルーティン名", "STUDY TIME (MIN)": "勉強時間（分）", "WEIGHT (KG)": "体重（kg）", "BODY FAT (%)": "体脂肪率（%）", "Add task": "タスク追加", "Add event": "予定追加", "Open calendar ↗": "カレンダーへ ↗", "Daily record": "日々の記録", "Recent entries": "過去の記録", "Journal archive": "日記アーカイブ", "Study trend": "学習時間の推移", "A page for your day.": "今日を振り返る", "Consistency beats intensity.": "小さな行動を、毎日の積み重ねに。", "Each block reflects its actual duration": "予定の長さを時間に合わせて表示", "No tasks yet.": "今日のタスクを追加しましょう", "No records yet.": "記録はまだありません", "No journal entries.": "日記はまだありません", "Own your schedule.": "予定を整え、集中する時間をつくる。", "A clear view of your progress.": "積み重ねてきた記録を確認する。", "Reflect. Refine. Repeat.": "振り返り、明日の行動につなげる。"};
function englishUI(value){const text=String(value??''),trimmed=text.trim();return UI_EN[trimmed]?text.replace(trimmed,UI_EN[trimmed]):text}
function translateUI(){if(!document.body||!document.createTreeWalker)return;
const walker=document.createTreeWalker(document.body,4),edits=[];let node;
while(node=walker.nextNode()){const parent=node.parentElement;if(!parent||parent.closest('script,style,textarea,.task-name,.x-item h3,.x-item p,.x-mini strong,.x-promise,.x-archive-open .small'))continue;const result=englishUI(node.nodeValue);if(result!==node.nodeValue)edits.push([node,result]);}
for(const [n,v] of edits)n.nodeValue=v;
for(const elem of document.querySelectorAll('[placeholder],[aria-label],[title]'))for(const attr of ['placeholder','aria-label','title']){const v=elem.getAttribute(attr);if(v){const next=englishUI(v);if(next!==v)elem.setAttribute(attr,next)}}}
if(typeof MutationObserver!=='undefined'){const uiObserver=new MutationObserver(()=>translateUI());uiObserver.observe(document.body,{childList:true,subtree:true});translateUI()}

ensure(now());persist();render();let lastDate=now(),lastReviewHour=new Date().getHours();setInterval(()=>{const current=now(),h=new Date().getHours();if(lastDate!==current){lastDate=current;ensure(current);persist();render()}else if(lastReviewHour<5&&h>=5){renderReview()}lastReviewHour=h},1000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker unavailable',err));
})();
</script>
